<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>毛絨絨小隊 測試入口</title>
<!-- 測試入口（大爺 10-02；10-08 githack 掛掉時加了 GitHub Pages 備用，後來大爺改回 githack 為主）：存成書籤。
     大按鈕：raw.githack 指定 dev 最新那一筆（40 碼 commit），推完馬上可測、沒有快取問題。
     下方小連結：GitHub Pages /dev/（.github/workflows/pages.yml 發佈），githack 回 429 時備用。
     這個檔案只放 main，遊戲本身不讀它。 -->
<style>
:root{--night:#2a1f18;--card:#3e2c21;--fur:#f4e7d3;--honey:#e8b04b;--ink:#2a1f18;--dim:#bfa98c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--night);color:var(--fur);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6;
  display:flex;align-items:flex-start;justify-content:center;padding:32px 16px}
main{width:100%;max-width:390px}
h1{font-size:20px;margin:0 0 16px}
.card{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:20px}
.msg{font-size:15px;word-break:break-word}
.meta{font-size:13px;color:var(--dim);margin-top:6px}
a.btn{display:block;text-align:center;text-decoration:none;font-size:18px;font-weight:700;
  padding:14px;border-radius:12px;margin-bottom:12px;border:2px solid var(--honey)}
a.btn.main{background:var(--honey);color:var(--ink)}
a.btn.ghost{color:var(--honey)}
.err{color:#ff9b8a}
.backup{margin-top:20px;font-size:13px;color:var(--dim)}
.backup a{color:var(--honey);margin-right:12px}
</style>
</head>
<body>
<main>
  <h1>毛絨絨小隊・測試版</h1>
  <div class="card" id="info"><div class="msg">正在問 GitHub 最新的是哪一版……</div></div>
  <div id="links"></div>
  <div class="backup" id="backup"></div>
</main>
<script>
const REPO = "dwarfossan/fuwafuwatavern", BRANCH = "dev";
const info = document.getElementById("info"), links = document.getElementById("links"), backup = document.getElementById("backup");
const fmt = d => new Date(d).toLocaleString("zh-TW", {hour12:false});
Promise.all([
  fetch(`https://api.github.com/repos/${REPO}/commits/${BRANCH}?t=${Date.now()}`, {cache:"no-store"})
    .then(r => { if(!r.ok) throw new Error("GitHub 回 " + r.status); return r.json(); }),
  fetch(`dev/version.json?t=${Date.now()}`, {cache:"no-store"}).then(r => r.ok ? r.json() : null).catch(() => null)
]).then(([c, live]) => {
    const sha = c.sha, msg = c.commit.message.split("\n")[0];
    info.innerHTML = `<div class="msg"></div><div class="meta">${fmt(c.commit.committer.date)}・${sha.slice(0,7)}</div>`;
    info.querySelector(".msg").textContent = msg;
    const liveEl = info.querySelector("#live");
    // 主要：githack 指定這一筆（10-08 大爺改回主要；推完馬上可測、沒有快取問題，但 githack 不穩可能回 429）
    const gh = `https://raw.githack.com/${REPO}/${sha}/index.html`;
    links.innerHTML = `<a class="btn main" href="${gh}#battle">測試戰鬥</a>
                       <a class="btn ghost" href="${gh}#ambush">營救商隊</a>
                       <a class="btn ghost" href="${gh}#town">直達城鎮</a>
                       <a class="btn ghost" href="${gh}">從頭玩</a>`;
    // 備用：GitHub Pages /dev/（githack 429 時用；推完約一兩分鐘發佈、有約 10 分鐘瀏覽器快取）
    if(!live){ backup.textContent = "GitHub 備用：還沒發佈完，等一兩分鐘重新整理。"; return; }
    const base = `dev/index.html?v=${live.sha.slice(0,7)}`;
    backup.innerHTML = `GitHub 備用（${live.sha.slice(0,7)}${live.sha!==sha?"，最新這筆還在發佈中":""}；githack 開不了時用）：<br><a href="${base}#battle">測試戰鬥</a><a href="${base}#ambush">營救商隊</a><a href="${base}#town">直達城鎮</a><a href="${base}">從頭玩</a>`;
  })
  .catch(e => {
    info.innerHTML = `<div class="msg err">查不到最新版（${e.message}）。等一下重新整理再試。</div>`;
  });
</script>
</body>
</html>
