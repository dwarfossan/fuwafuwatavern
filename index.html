<title>毛絨絨小隊</title>
<script>
/* 只做手機版（大爺 10-02）：電腦等寬螢幕開，改用 phone.html 把遊戲裝在手機寬的框裡
   框裡的視窗寬度就是手機寬，版面、@media、vw、fixed 都跟手機一模一樣 */
if(window.top===window.self && window.innerWidth>600) location.replace("phone.html"+location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>
// 首屏圖片在遊戲脚本下載前開始載入；只請求目前入口會顯示的那張。
{const sources=[];
 if(!location.hash)sources.push('assets/portraits/party_heads.webp');
 if(location.hash==='#ambush')sources.push('assets/scenes/caravan_encounter.webp');
 if(location.hash==='#town'||location.hash==='#ambush')for(const id of ['fox','tiger','wolf','raccoon'])sources.push(`assets/faces/${id}/normal.webp`);
 if(location.hash==='#town')for(const id of ['mira','brun','ada','liliana'])sources.push(`assets/portraits/${id}_noface.webp`,`assets/faces/${id}/sheet.webp`);
 for(const src of sources){const link=document.createElement('link');link.rel='preload';link.as='image';link.href=src;link.fetchPriority='high';document.head.append(link);}}
</script>
</head>
