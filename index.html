// 切換整組手持配置：主手＋副手一起切換；整理裝備不消耗動作
function swapWeapon(u, i){
  const w=u.spare&&u.spare[i];
  if(!w)return;
  const old=u.weapon, oldOff=u.shield?{n:"盾牌",type:"shield",_shield:true}:null, nextOff=u.offhand2||null;
  u.weapon=w; u.spare[i]=old;
  u.shield=!!nextOff;
  u.offhand2=oldOff;
  if(isTwoHand(u.weapon) && u.shield){u.offhand2={n:"盾牌",type:"shield",_shield:true};u.shield=false;}
  blog(`${u.name}切換了武器組：${u.weapon.n}${u.shield?"＋盾牌":""}`,"skill");
  render();
}
// 撲滅火焰（動作）
function doDouse(u){
  useAction(u); u.statuses = u.statuses.filter(s=>s.k!=="burning");
  u.anim = {k:"guard", t:Date.now()}; sfx("swing");
  blog(`${u.name}拍熄身上的火`, "skill");
  if(u.side==="pc") afterShow(u, 600); else render();
}
// 掙脫網子（動作）：力量檢定對網子的難度
function doUnnet(u){
  const rs = has(u,"restrained"), r = d20(), total = r + u.mods.STR, ok = total >= rs.dc;
  useAction(u);
  blog(`${u.name}想掙脫網子：力量 d20=${r}${fmtN(u.mods.STR)} = ${total} ${ok?"≥":"<"} ${rs.dc} → ${ok?"掙脫了！":"還纏著"}`, ok?"skill":"miss");
  if(ok){ u.statuses = u.statuses.filter(s=>s!==rs); u.anim = {k:"hop", t:Date.now()}; sfx("swing"); }
  if(u.side==="pc") afterShow(u, 700); else render();
}
// 靈巧脫逃（哥布林的天生能力，免費動作）：撤離或躲藏
const nimble = u => (u.innate||[]).includes("nimble") && freeLeft() && u===cur();   // 只用免費那格，主動作留著出手
function nimbleDisengage(u){ if(!nimble(u)) return false; observeInnate(u,"nimble","靈巧脫逃"); B().freeUsed = true; addStatus(u, "disengage", {until:"end", of:u.id}); blog(`${u.name}靈巧脫逃：撤離！`, "skill"); return true; }
function nimbleHide(u){ if(!nimble(u) || u.dead || u.down || hideBlock(u)) return false; observeInnate(u,"nimble","靈巧脫逃"); B().freeUsed = true; blog(`${u.name}靈巧脫逃：躲起來！`, "skill"); tryHide(u); return true; }

function doSkill(u, sk, t){
  const b = B();
  // 普通基本攻擊不觸發學習；法器第 0 招若本身不是基本攻擊（如火焰箭）仍可學。
  if(u.side==="foe" && !sk.def.basicAttack && !(sk.idx===0 && HAS_BASIC(sk.group))) observedSkill(u,sk.key,sk.def.name,false);
  const up = Math.min(b.up||0, maxUp(u, sk));          // 升環：多花的點數（超過就砍到上限）
  const names = Array.isArray(t) ? [...new Set(t.map(x=>x.name))].join("、") : (t && t.name && t!==u ? t.name : "");
  const paid = spendPts(u, sk, up);
  blog(`${u.name}使用【${sk.def.name}】${names ? `→ ${names}` : ""}${paid ? `（${paid} 點${up ? `，升 ${up}` : ""}）` : ""}`, "skill");
  const t0 = Array.isArray(t) ? t[0] : t;
  if(t0 && t0!==u && t0.x!==undefined) faceTo(u, t0);
  const k = sk.anim || animFor(sk.group.id, sk.idx);
  // 會擲骰的招（攻擊、豁免）先讓骰子滾完，角色才出招；輔助不擲骰，照舊馬上動
  const lead = sk.def.kind!=="輔助" && !sk.impl.multi ? DICE_LEAD : 0;
  u.anim = {k, t:Date.now() + lead}; animSfx(k, lead);
  const hitAt = b.impact = launch(u, t, k, lead);
  b.impactEnd = Math.max(b.impactEnd||0, Date.now() + hitAt);
  panelStart(`${u.name}【${sk.def.name}】`);      // 骰子面板
  b.up = up; b.upBy = u.id; b.upDice = canUp(sk) && !sk.def.up ? up : 0;   // 沒寫升環效果的攻擊招：命中多武器骰
  sk.impl.run(u, t);
  b.up = 0; b.upBy = null; b.upDice = 0; panelEnd();
  reveal(u, "出手，現身了！");               // 用技能（攻擊、施法）就現身
  b.impact = 0;
  if(sk.def.free) spendFree(u); else useAction(u);
  b.mode = null;
  if(checkResult()) return;
  if(u.side==="pc") afterShow(u, Math.max(DOLL_DUR[k]||500, hitAt + 900, (b.impactEnd||0) - Date.now()));
  else render();
}
// 動作演出期間：鎖住操作、選單先收起來，演完才重新打開
function afterShow(u, ms){
  const b = B();
  b.busy = true; b.menu = null; render();
  setTimeout(()=>{
    if(B()!==b) return;
    b.busy = false;
    if(!b.result && cur()===u && !u.down && !u.dead) b.menu = "root";
    render();
  }, ms);
}

// 敵人動作後要等多久才換下一隻：至少 ms，而且要等飛行物打中後再看一下
const settle = ms => Math.max(ms, (B().impactEnd||0) - Date.now() + 600);

// ---------- 敵人挑招（跟我方同一套技能，照手上的武器、法器） ----------
// 範圍招（橫掃、震地、回掃）：身邊有兩個以上看得到的敵人才用
const AOE_SELF = {heavy_1:u=>1, mace_2:u=>1, polearm_2:u=>reachOf(u)};
const foeUsable = e => unitSkills(e).filter(s=>s.impl && !s.impl.passive && hasAmmoFor(e) && skillReady(e,s) && !(s.impl.can && !s.impl.can(e)) && !(fromTwoHanded(e,s) && inGrapple(e)));
// 對 t 能用的攻擊招：花點數的招式點數夠就用（六成機率），不然普攻；回傳 {sk, t}
// 升環先不做（一律花基本點數）；之後頭目會省點數，再加判斷
function foePick(e, t){
  const sks = foeUsable(e);
  const aoe = sks.find(s=>AOE_SELF[s.key] && seenPcs().filter(p=>dist(p,e)<=AOE_SELF[s.key](e)).length >= 2);
  if(aoe) return {sk:aoe, t:e};
  const onT = t ? sks.filter(s=>["enemy","line"].includes(s.impl.target) && validTarget(e, s, t.x, t.y)) : [];
  if(!onT.length) return null;
  const special = onT.filter(s=>costOf(e,s) > 0);
  const sk = special.length && Math.random() < .6 ? special[Math.floor(Math.random()*special.length)] : (onT.find(s=>s.idx===0) || onT[0]);
  return {sk, t};
}
// 回合開始的免費動作：補血（同伴血掉一半）、舉盾護著被貼身的同伴、敵人靠近時開護盾術、有人要靠近時擺阻截架式
function foeFreePick(e){
  const pcs = seenPcs();
  for(const s of foeUsable(e).filter(s=>s.def.free)){
    if(s.group.id==="shield"){ const t = alive(e.side).find(o=>o!==e && dist(o,e)===1 && pcs.some(p=>dist(p,o)<=1)); if(t) return {sk:s, t}; continue; }
    if(s.impl.target==="ally"){ const t = alive(e.side).filter(o=>o.hp<=o.maxHp/2 && validTarget(e,s,o.x,o.y)).sort((a,c)=>a.hp-c.hp)[0]; if(t) return {sk:s, t}; continue; }
    if(s.def.name==="護盾術" && !has(e,"shieldSpell") && pcs.some(p=>dist(p,e)<=2)) return {sk:s, t:e};
    if(s.key==="polearm_1" && !has(e,"guard") && pcs.some(p=>dist(p,e)<=reachOf(e)+4)) return {sk:s, t:e};
  }
  return null;
}
// 對 t 出手：挑到招就用，回傳要等多久；打不到回傳 0
function foeHit(e, t){
  const p = foePick(e, t);
  if(!p) return 0;
  B().up = 0;
  doSkill(e, p.sk, p.sk.impl.multi ? foeDarts(e, p.sk, t) : p.t);
  return settle(Math.max(DOLL_DUR[animFor(p.sk.group.id, p.sk.idx)] || 700, 700));
}
// 魔法飛彈分目標：每發打「還沒被分到足以打倒的傷害、血最少的」，大家都分夠了就補在血最少的身上（每發平均算 3.5）
function foeDarts(e, sk, t){
  const n = sk.impl.darts(), pool = seenPcs().filter(p=>validTarget(e, sk, p.x, p.y)).sort((a,c)=>a.hp-c.hp);
  if(!pool.length) return Array(n).fill(t);
  const got = new Map(), out = [];
  for(let i=0;i<n;i++){
    const p = pool.find(p=>(got.get(p)||0) < p.hp) || pool[0];
    got.set(p, (got.get(p)||0) + 3.5); out.push(p);
  }
  return out;
}
// 這隻用什麼當遠程：拿彈藥武器 → 武器射程；拿法器 → 普攻法術的射程；都沒有 → 0（近戰）
function foeRange(e){
  if(isRanged(e)) return rangeOf(e);
  const s = unitSkills(e).find(s=>s.idx===0 && s.impl && s.group.weapons.some(n=>(ITEMS.find(i=>i.n===n)||{}).type==="focus") && s.impl.target==="enemy");
  return !e.weapon && s && s.impl.range ? s.impl.range(e) : 0;
}

// ---------- 敵人的戰技：貼身時先看有沒有更好的招，沒有就打 ----------
// 1. 抓住拿雙手遠程武器的（弓、弩）：被抓住就不能用雙手武器
// 2. 打掉只靠法器的（玲玲、法書、法球）：沒法器就沒法術
// 3. 有別的哥布林也貼著同一個人 → 推倒他，讓同伴近戰有優勢
// 條件照規則走：擒抱要有空手、不能已經抓著人；推撞、繳械都要在觸及內
function foeManeuver(e, adj){
  if(isRanged(e) || e.dead) return null;
  const pick = (key, list) => { const t = list.filter(p=>GEN_ACT[key].targets(e).includes(p))[0]; return t ? {key, t} : null; };
  const shooters = adj.filter(p=>isRanged(p) && holdsTwoHanded(p) && !has(p,"grappled"));
  if(freeHand(e) && !victimsOf(e).length){ const m = pick("grapple", shooters); if(m) return m; }
  const casters = adj.filter(p=>!p.weapon && p.focus);
  { const m = pick("disarm", casters); if(m) return m; }
  const ganged = adj.filter(p=>!has(p,"prone") && alive("foe").some(o=>o!==e && dist(o,p)<=1));
  { const m = pick("shove_prone", ganged); if(m) return m; }
  return null;
}
// 貼身時的一回合動作：戰技或攻擊血最少的；回傳要等多久才換人
function foeMelee(e, adj){
  const m = foeManeuver(e, adj);
  if(m){ doGenAct(e, m.key, m.t); return settle(1300); }
  return foeHit(e, adj.sort((a,c)=>a.hp-c.hp)[0]) || 600;
}

// ---------- 敵人 AI：走向最近的角色，貼身就打 ----------
const seenPcs = () => alive("pc").filter(p=>!isHid(p));        // 敵人看得到的角色（躲著的不算）
function aiTurn(e){
  const b = B();
  if(b.result || e.dead) return;
  if(!alive("pc").length) return;
  // 被網住：先掙脫；身上著火快燒死：先撲滅
  if(has(e,"restrained")){ doUnnet(e); setTimeout(endTurn, settle(800)); return; }
  if(has(e,"burning") && e.hp<=4){ doDouse(e); setTimeout(endTurn, 800); return; }
  // 免費動作：有用得上的免費招式就先用，再回來做這回合的主動作
  // 免費那格用過了、同伴快倒（剩四分之一）→ 用主動作再補一次
  { const f = foeFreePick(e);
    if(f && (!b.freeUsed || (canAct() && f.sk.impl.target==="ally" && f.t.hp<=f.t.maxHp/4))){ doSkill(e, f.sk, f.t); setTimeout(()=>{ if(b.result) return; if(cur()===e && !e.dead && !e.down) aiTurn(e); else endTurn(); }, settle(900)); return; } }
  if(!canAct()){ render(); setTimeout(endTurn, 500); return; }        // 主動作拿去補血了：這回合就這樣
  // 學習系統測試：每隻哥布林先使用一項「既有技能表」裡的招式一次。
  // 不新增測試專用技能，先驗證：敵人施放 → 被動觀察 → 理解/失敗 → 小筆記。
  if(!e.testSkillUsed && e.testSkill){
    const sk=learnedSkillByKey(e.testSkill);
    if(sk && sk.impl && skillReqMet(e,sk) && e.pts>=costOf(e,sk)){
      let t=null;
      if(sk.impl.target==="self") t=e;
      else if(sk.impl.target==="enemy"){
        const r=sk.impl.range?sk.impl.range(e):1;
        t=seenPcs().filter(p=>dist(p,e)<=r).sort((a,c)=>a.hp-c.hp)[0]||null;
      }
      if(t){ e.testSkillUsed=true; doSkill(e,sk,t); setTimeout(endTurn,settle(1000)); return; }
    }
  }
  if(e.focus && groupOf(e.focus).id==="shaman_totem") return aiShaman(e);
  const pcs = seenPcs();
  if(!pcs.length){ blog(`${nameFor(e)}東張西望，找不到人。`); setTimeout(endTurn, 700); return; }
  const holder = grapplerOf(e);
  if(holder){
    if(!isRanged(e) && !holdsTwoHanded(e) && dist(holder,e)<=reachOf(e)){ setTimeout(endTurn, foeHit(e, holder) || 700); return; }
    doEscape(e); setTimeout(endTurn, settle(700)); return;
  }
  // 手上空空的：找走得到、撿得起來的東西（自己的、或我方掉的都行），挑最近的
  const reach = !e.weapon && !e.focus && (b.drops||[]).length ? reachable(e, b.moveLeft) : null;
  const grab = reach && (b.drops||[]).filter(d=>canPick(e, d.item) && reach.has(`${d.x},${d.y}`))
    .map(d=>({d, path:reach.get(`${d.x},${d.y}`)})).sort((x,y)=>x.path.cost-y.path.cost)[0];
  if(grab){
    const nearFist = pcs.some(p=>dist(p,e)<=1);
    // 旁邊有人而且東西要走很遠 → 先揮拳；不然去撿（撿完如果打得到人就打）
    if(!(nearFist && grab.path.cost > 2)){
      blog(`${e.name}衝去撿${grab.d.name}！`);
      b.busy = true;
      walk(e, grab.path, ()=>{ b.busy = false;
        const r = foeRange(e) || reachOf(e), t = seenPcs().filter(p=>dist(p,e)<=r)[0];
        let wait = 700;
        if(t && !e.dead) wait = foeHit(e, t) || 700;
        render(); setTimeout(endTurn, wait); });
      return;
    }
  }
  if(foeRange(e)) return aiRanged(e, pcs, foeRange(e));
  const adj = pcs.filter(p=>dist(p,e)<=reachOf(e));
  if(adj.length){ setTimeout(endTurn, foeMelee(e, adj)); return; }
  // 找離自己最近、能貼身的角色
  const all = reachable(e, 99);
  let best = null;
  pcs.forEach(p=>{
    for(const [dx,dy] of DIRS){
      const path = all.get(`${p.x+dx},${p.y+dy}`);
      if(path && (!best || path.cost < best.path.cost)) best = {p, path};
    }
  });
  if(!best || !b.moveLeft){ blog(`${e.name}在原地大叫。`); setTimeout(endTurn, 600); return; }
  const steps = trimPath(best.path, b.moveLeft, victimsOf(e).length ? 2 : 1, e);
  b.busy = true;
  walk(e, steps, ()=>{
    b.busy = false;
    const near = seenPcs().filter(p=>dist(p,e)<=reachOf(e));
    let wait = 700;
    if(near.length && !e.dead && !(b.dazed && steps.length)){
      // 走過去之後優先處理原本鎖定的那隻（戰技的判斷一樣適用）
      const first = near.includes(best.p) ? [best.p, ...near.filter(p=>p!==best.p)] : near;
      const m = foeManeuver(e, first);
      if(m){ doGenAct(e, m.key, m.t); wait = settle(1300); } else wait = foeHit(e, first[0]) || 700;
    }
    render();
    setTimeout(endTurn, wait);
  });
}
// 遠程（弓、法器）：被貼身就找一格離大家都至少 2 格、而且最遠的地方退過去；射程內挑好打的出手
function aiRanged(e, pcs, R){
  const b = B();
  const nearest = p => Math.min(...seenPcs().map(q=>dist(q,p)));
  const shoot = ()=>{
    // 跳開途中被打倒（藉機攻擊）或戰鬥已經結束：不射、不留遺言；戰鬥還沒結束就照常換人
    if(e.dead || e.down || b.result){ render(); if(!b.result) setTimeout(endTurn, settle(700)); return; }
    // 挑好打的：沒掩護、沒躲草叢的優先，再挑血少的
    const hard = p => coverAC(coverOf(e,p)) + (hidden(p) ? 5 : 0);
    const inRange = seenPcs().filter(p=>dist(p,e)<=R).sort((a,c)=>hard(a)-hard(c) || a.hp-c.hp);
    let wait = 700;
    if(inRange.length && !e.dead){ wait = foeHit(e, inRange[0]) || 700; nimbleHide(e); }
    else blog(`${e.name}找不到可以射的目標。`);
    render(); setTimeout(endTurn, wait);
  };
  let path = null;
  if(nearest(e) <= 1 && b.moveLeft){
    let best = null;
    reachable(e, b.moveLeft).forEach((p,k)=>{
      const [x,y] = k.split(",").map(Number), d = nearest({x,y});
      if(d>=2 && (!best || d>best.d || (d===best.d && p.cost<best.path.cost))) best = {d, path:p};
    });
    if(best){ path = best.path; nimbleDisengage(e); blog(`${e.name}往後跳開，拉開距離！`); }
  } else if(!pcs.some(p=>dist(p,e)<=R) && b.moveLeft){
    // 射程外：往最近的角色靠近到射程內
    const t = pcs.sort((a,c)=>dist(a,e)-dist(c,e))[0];
    let best = null;
    reachable(e, b.moveLeft).forEach((p,k)=>{ const [x,y]=k.split(",").map(Number), d=dist({x,y},t);
      if(d<=R && d>=2 && (!best || p.cost<best.path.cost)) best={path:p}; });
    if(best) path = best.path;
  }
  if(!path){ shoot(); return; }
  b.busy = true;
  walk(e, path, ()=>{ b.busy = false; shoot(); });
}

// ---------- 哥布林薩滿：躲在草叢裡施法（法術都來自薩滿圖騰） ----------
// 1. 已經現身、上回合施過法、藏得住、旁邊沒人 → 躲回去
// 2. （治癒真言是免費動作：回合一開始，12 格內有同伴血掉一半就先補）
// 3. 6 格內看得到角色、災禍術還沒用 → 災禍術
// 4. 射程內看得到角色 → 火焰箭（被貼身先跳開，跟弓手一樣）
// 5. 都沒有：躲著就靜靜等，現身了就往前靠
function aiShaman(e){
  const pcs = seenPcs(), spell = n => foeUsable(e).find(s=>s.def.name===n);
  if(!isHid(e) && e.castLast && !hideBlock(e)){
    e.castLast = false;
    blog(`${e.name}縮回藏身處……`, "skill"); e.anim = {k:"guard", t:Date.now()}; animSfx("guard");
    tryHide(e); render(); setTimeout(endTurn, 1000); return;
  }
  e.castLast = false;
  const bane = spell("災禍術"), bolt = spell("火焰箭");      // 治癒真言是免費動作，回合一開始就用了（foeFreePick）
  if(bane && pcs.some(p=>dist(p,e)<=6 && !baned(p))) return shamanCast(e, bane, e);
  const R = bolt ? bolt.impl.range(e) : 0;
  if(R && pcs.some(p=>dist(p,e)<=R)){ e.castLast = true; return aiRanged(e, pcs, R); }
  if(isHid(e) || !pcs.length){ if(!isHid(e)) blog(`${e.name}東張西望，找不到人。`); setTimeout(endTurn, 700); return; }
  aiRanged(e, pcs, R || 1);
}
function shamanCast(e, sk, t){
  doSkill(e, sk, t);
  e.castLast = true;
  if(nimbleHide(e)) e.castLast = false;                     // 靈巧脫逃：施完法馬上躲回去
  setTimeout(endTurn, settle(1200));
}

// ---------- 飄字 ----------
// 被動觀察的頭上符號：kind＝ok（!）、fail（?）、known（...）；停留時間依演出長短
const OBS_DUR = {ok:1400, fail:1700, known:2000};
function obsMark(u, kind){ (B().marks = B().marks || []).push({id:u.id, kind, t:impactAt(), dur:OBS_DUR[kind]}); }
function fxFloat(u, text, cls){ (B().floats = B().floats || []).push({x:u.x, y:u.y, text, cls, t:impactAt()}); }

/* ======================== 戰鬥畫面：45 度戰棋、棋子、操作面板 ======================== */
const TW = 128, TH = 64;   // 一格菱形的寬、高
const TREE_K = 1.5, WAGON_K = 1.4;   // 樹、篷車的放大倍率（原本照 96 寬的格子畫）

// 裝備圖示（手繪風，見 js/art/icons.js）
const iconSVG = (k, size=16) => `<svg viewBox="-14 -14 148 148" width="${size}" height="${size}" aria-hidden="true">${ITEM_ART[k]||""}</svg>`;

// 格子座標 → 畫面座標；會加上那格的高度（一層往上 HZ 像素），站在上面的東西都跟著抬高
function iso(x, y){ const d=B().def; return {x:(x-y)*TW/2 + d.h*TW/2, y:(x+y)*TH/2 + 130 - hAt(x,y)*HZ}; }
const diamond = (x,y) => { const p=iso(x,y); return `${p.x},${p.y} ${p.x+TW/2},${p.y+TH/2} ${p.x},${p.y+TH} ${p.x-TW/2},${p.y+TH/2}`; };

function boardSVG(){
  const b = B(), d = b.def, u = cur();
  const W = (d.w+d.h)*TW/2, H = (d.w+d.h)*TH/2 + 150;
  const out = [];
  const isRoad = (x,y) => d.road.some(r=>r[0]===x&&r[1]===y);
  // 可移動／可選目標
  let moveSet = new Map(), tgtSet = new Set(), areaSet = new Set(), range = -1;
  const myTurn = u && u.side==="pc" && !b.busy && !b.result;
  if(myTurn && !b.mode && b.moveMode && !(b.dazed && b.actionUsed)) moveSet = reachable(u, b.moveLeft);
  if(myTurn && b.mode && b.mode.key==="observe"){ observeTargets().forEach(p=>tgtSet.add(`${p.x},${p.y}`)); }
  else if(myTurn && b.mode && b.mode.key==="help"){ range = 1; helpList(u).forEach(p=>tgtSet.add(`${p.x},${p.y}`)); }
  else if(myTurn && b.mode && b.mode.key==="item"){ const it = u.items.find(i=>i.id===b.mode.item);
    if(it){ range = it.use.range; itemTargets(u, it).forEach(p=>tgtSet.add(`${p.x},${p.y}`)); } }
  else if(myTurn && b.mode && GEN_ACT[b.mode.key]){ range = 1; GEN_ACT[b.mode.key].targets(u).forEach(p=>tgtSet.add(`${p.x},${p.y}`)); }
  else if(myTurn && b.mode){
    const sk = unitSkills(u).find(s=>s.key===b.mode.key);
    if(!sk || !sk.impl){ b.mode=null; return boardSVG(); }
    range = sk.impl.range ? sk.impl.range(u) : 1;
    // 點地板的招（範圍、錐形）：整個射程淡紅，點哪都行；點人的招：只有打得到的敵人亮紅
    const pickFloor = ["area","cone"].includes(sk.impl.target);
    for(let x=0;x<d.w;x++) for(let y=0;y<d.h;y++) if(validTarget(u,sk,x,y)) (pickFloor ? areaSet : tgtSet).add(`${x},${y}`);
  }
  // 地板
  const tileCls = k => tgtSet.has(k) ? "tg" : areaSet.has(k) ? "ar" : moveSet.has(k) ? "mv" : "";
  const tileFill = (x,y) => { const road=isRoad(x,y), alt=(x+y)%2; return road ? (alt?"#d9c08e":"#d2b683") : (alt?"#8fb462":"#86ab5a"); };
  const nowOn = u && !b.result && !u.dead && !u.down && !foeHid(u) ? u : null;
  const raised = [];
  for(let s=0;s<d.w+d.h-1;s++) for(let x=0;x<d.w;x++){ const y=s-x; if(y<0||y>=d.h) continue;
    if(hAt(x,y) > 0){ raised.push({x,y}); continue; }
    const k=`${x},${y}`;
    out.push(`<polygon class="tile ${tileCls(k)}" data-tile="${k}" points="${diamond(x,y)}" fill="${tileFill(x,y)}" stroke="#5f8744" stroke-width="1"/>`);
  }
  // 凸起的格子：頂面（高亮、點擊都在這裡）＋朝畫面前方的兩面山壁（往下畫到前面那格的高度）
  const columnSVG = (x,y) => {
    const k=`${x},${y}`, p=iso(x,y), h=hAt(x,y), L=p.x-TW/2, R=p.x+TW/2, M=p.y+TH/2, Bt=p.y+TH;
    const dl = (h - hAt(x,y+1))*HZ, dr = (h - hAt(x+1,y))*HZ;   // 左前、右前那格比這格低多少
    const strata = (x1,y1,x2,y2,dd) => [1,2].filter(i=>i*HZ/2 < dd).map(i=>`<path d="M${x1} ${y1+i*HZ/2} L${x2} ${y2+i*HZ/2}" stroke="#5e4630" stroke-width="2" opacity=".55"/>`).join("");
    return `<g class="cliff">
      ${dl>0 ? `<polygon points="${L},${M} ${p.x},${Bt} ${p.x},${Bt+dl} ${L},${M+dl}" fill="#9a7650" stroke="#2a2630" stroke-width="2" stroke-linejoin="round"/>${strata(L,M,p.x,Bt,dl)}` : ""}
      ${dr>0 ? `<polygon points="${p.x},${Bt} ${R},${M} ${R},${M+dr} ${p.x},${Bt+dr}" fill="#7a5a3c" stroke="#2a2630" stroke-width="2" stroke-linejoin="round"/>${strata(p.x,Bt,R,M,dr)}` : ""}
      <polygon class="tile ${tileCls(k)}" data-tile="${k}" points="${diamond(x,y)}" fill="${tileFill(x,y)}" stroke="#5f8744" stroke-width="1"/>
      <polygon points="${diamond(x,y)}" fill="#fffbe8" opacity="${Math.min(.24, h*.08)}" pointer-events="none"/>
      ${[[hAt(x-1,y),L,M,p.x,p.y],[hAt(x,y-1),p.x,p.y,R,M],[hAt(x+1,y),R,M,p.x,Bt],[hAt(x,y+1),p.x,Bt,L,M]]
        .filter(e=>e[0]<h).map(e=>`<path d="M${e[1]} ${e[2]} L${e[3]} ${e[4]}" stroke="#2a2630" stroke-width="2" stroke-linecap="round" pointer-events="none"/>`).join("")}
      ${nowOn && nowOn.x===x && nowOn.y===y ? `<polygon class="tile-now" points="${diamond(x,y)}"/>` : ""}</g>`;
  };
  // 射程邊框：沿著射程邊緣描一圈（射程超出地圖的那幾邊不畫）
  if(range>=0) out.push(rangeOutline(u, range));
  // 輪到的單位：腳下那格整格發光（畫在地板上、物件和棋子底下）
  if(nowOn && hAt(nowOn.x,nowOn.y)===0) out.push(`<polygon class="tile-now" points="${diamond(nowOn.x,nowOn.y)}"/>`);
  // 物件與棋子，依前後順序畫
  const things = [];
  // 地形柱排在同一格的物件、角色前面（s 比較小），比牠後面的角色晚畫，所以會擋住後面的人
  raised.forEach(({x,y})=>{ const p=iso(x,y), low=Math.min(hAt(x,y+1), hAt(x+1,y));
    things.push({s:x+y-.1, svg:columnSVG(x,y), box:[p.x-TW/2, p.y, p.x+TW/2, p.y+TH+(hAt(x,y)-low)*HZ]}); });
  (b.drops||[]).forEach(dp=> things.push({s:dp.x+dp.y+.2, svg:dropSVG(dp)}));
  d.blocks.forEach(o=> things.push({s:o.x+o.y + (o.kind==="bush" ? .6 : 0), svg:blockSVG(o), box:blockBox(o)}));
  const now = Date.now();
  // 剛被打倒的敵人多留一下，播完倒下動畫才消失
  // 躲著的敵人不畫（玩家不知道牠在哪）
  const shown = b.units.filter(v=>(!v.dead || now - v.deadAt < 900) && !foeHid(v));
  shown.forEach(v=> things.push({s:v.x+v.y+.5, svg:tokenSVG(v, v===u), box:unitBox(v), unit:v}));
  things.sort((a,c)=>a.s-c.s).forEach(t=>out.push(t.svg));
  // 被擋住的角色：被前面的樹／篷車／角色蓋住超過 35%，在最上層畫一圈剪影外框（我方各自的顏色、敵人紅色）
  // 外框可以點（data-tile），瞄準時直接點它就選到後面那隻
  const hiddenOnes = things.filter(t=>t.unit && !t.unit.dead &&
    things.some(f=> f!==t && f.box && f.s > t.s && overlapRatio(t.box, f.box) > .35));
  if(hiddenOnes.length){
    const cols = [...new Set(hiddenOnes.map(t=>olColor(t.unit)))];
    out.push(`<defs>${cols.map(olFilter).join("")}</defs>`);
    hiddenOnes.forEach(t=>out.push(`<g class="hid-ol" data-tile="${t.unit.x},${t.unit.y}" filter="url(#ol-${olColor(t.unit).slice(1)})">${unitDoll(t.unit, t.unit===u)}</g>`));
  }
  // 瞄準時：可以打的敵人旁邊標出夾擊／掩護／草叢（夾擊只算武器近戰：拿彈藥武器、用法器施法都不算）
  const skNow = b.mode && b.mode.key!=="item" && unitSkills(u).find(s=>s.key===b.mode.key);
  const meleeSk = skNow && !isRanged(u) && !skNow.group.weapons.some(n=>(ITEMS.find(i=>i.n===n)||{}).type==="focus");
  if(range>=0 && skNow) tgtSet.forEach(k=>{
    const [x,y] = k.split(",").map(Number), t = unitAt(x,y); if(!t || t.side===u.side) return;
    const cov = coverOf(u, t), far = dist(u,t) > reachOf(u);
    const tags = [meleeSk && flankMate(u, t) ? "夾擊 優勢" : "", coverAC(cov) ? `掩護 +${coverAC(cov)}` : "", far && hidden(t) ? "草叢 劣勢" : ""].filter(Boolean);
    if(!tags.length) return;
    const p = iso(x,y), cx = p.x, cy = p.y + TH/2 + 22, w = tags.join("・").length*19 + 20;
    out.push(`<g class="cov-tag"><rect x="${cx-w/2}" y="${cy-16}" width="${w}" height="32" rx="16" fill="#1f1a24" stroke="#ff8a7a" stroke-width="2.5"/>
      <text x="${cx}" y="${cy+6}" text-anchor="middle">${tags.join("・")}</text></g>`);
  });
  // 飛行物（出手時才出現，飛到目標消失）
  b.proj = (b.proj||[]).filter(pj=>now < pj.t + pj.dur + 80);
  b.proj.forEach(pj=>out.push(`<g data-exp="${pj.t+pj.dur+80}">${projSVG(pj, now)}</g>`));
  // 打中特效（在打中的時間點才出現）
  b.fx = (b.fx||[]).filter(f=>now-f.t<700);
  b.fx.forEach(f=>{ const p=iso(f.x,f.y); out.push(`<g data-exp="${f.t+700}">${fxSVG(f.kind, p.x, p.y+TH/2-54, now-f.t)}</g>`); });
  // 飄字
  b.floats = (b.floats||[]).filter(f=>now-f.t<1100);
  b.floats.forEach(f=>{ const p=iso(f.x,f.y);
    out.push(`<text class="float ${f.cls}" data-exp="${f.t+1100}" x="${p.x}" y="${p.y+TH/2-146}" text-anchor="middle" style="animation-delay:${f.t-now}ms">${f.text}</text>`); });
  // 被動觀察符號
  b.marks = (b.marks||[]).filter(m=>now < m.t + m.dur);
  b.marks.forEach(m=>{ const v = b.units.find(u=>u.id===m.id); if(v && !v.dead) out.push(obsMarkSVG(v, m, now)); });
  // 戰鬥台詞：頭上的氣泡框
  b.bubbles = (b.bubbles||[]).filter(x=>now < x.t + x.dur);
  b.bubbles.forEach(x=>{ const v = b.units.find(u=>u.id===x.id); if(v && !foeHid(v)) out.push(bubbleSVG(v, x, now)); });
  const z = camZoom(), c = b.cam || {x:0, y:0};
  // 鏡像只作用在戰場內容（地形、物件、棋子、戰場特效），HUD／選單／狀態視窗都在 SVG 外，不受影響。
  // 文字再反轉一次保持可讀；格子 data-tile 與戰鬥座標完全不改，所以純屬顯示層。
  if(b.critOn){   // 爆擊：以目標為中心拉近
    const p = iso(b.critOn.x, b.critOn.y);
    return `<svg class="board crit-zoom" viewBox="0 0 ${W} ${H}" width="${Math.round(W*z)}" height="${Math.round(H*z)}" style="--cx:${c.x}px;--cy:${c.y}px;transform:translate(${c.x}px,${c.y}px);transform-origin:${p.x*z}px ${(p.y+TH/2-50)*z}px" xmlns="http://www.w3.org/2000/svg">${out.join("")}</svg>`;
  }
  return `<svg class="board" viewBox="0 0 ${W} ${H}" width="${Math.round(W*z)}" height="${Math.round(H*z)}" style="transform:translate(${c.x}px,${c.y}px)" xmlns="http://www.w3.org/2000/svg">${out.join("")}</svg>`;
}

/* ---------- 鏡頭：拖曳平移＋縮放（滑鼠、觸控共用 Pointer Events） ----------
   單指／滑鼠按下後移動超過 DRAG_TOL 像素就算拖曳，沒超過就當成點格子。
   縮放：桌機滾輪（以游標為中心），手機兩指張開／合起（以兩指中點為中心）。
   鏡頭位置 B().cam、縮放 B().zoom 存在戰鬥狀態裡，重畫時沿用。 */
const DRAG_TOL = 6, ZOOM_MIN = .35, ZOOM_MAX = 1.5;
const zoomDefault = () => window.innerWidth < 560 ? .45 : .6;
const camZoom = () => (B() && B().zoom) || zoomDefault();
/* 頭上提示（狀態圖示、台詞氣泡、觀察符號）的縮放（大爺 2026-10-01：縮小地圖時太大）
   跟著地圖一起縮放，在預設縮放時跟以前一樣大；地圖縮小時跟著縮，但畫面上最小保留原本的 60%，才看得清楚 */
const OVERLAY_MIN = .6;
const overlayK = () => Math.max(1 / zoomDefault(), OVERLAY_MIN / camZoom());
const clampZoom = z => Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
const boardRaw = () => { const d=B().def; return {w:(d.w+d.h)*TW/2, h:(d.w+d.h)*TH/2+150}; };
function boardSize(){ const r=boardRaw(), z=camZoom(); return {w:r.w*z, h:r.h*z}; }
function clampCam(c){
  const wrap = document.querySelector(".board-wrap"); if(!wrap) return c;
  const vw = wrap.clientWidth, vh = wrap.clientHeight, s = boardSize();
  const mx = Math.min(90, vw*.15), my = Math.min(90, vh*.15);    // 地圖邊緣最多拉進畫面一點點，不會露出一大片空白
  const lim = (v, view, size, m) => size + 2*m <= view ? (view-size)/2 : Math.min(m, Math.max(view-size-m, v));
  return {x:lim(c.x, vw, s.w, mx), y:lim(c.y, vh, s.h, my)};
}
function applyCam(glide){
  const svg = document.querySelector(".board"), b = B(); if(!svg || !b.cam) return;
  const s = boardSize();
  svg.setAttribute("width", Math.round(s.w)); svg.setAttribute("height", Math.round(s.h));
  svg.style.transition = glide ? "transform .35s ease" : "";
  svg.style.transform = `translate(${b.cam.x}px,${b.cam.y}px)`;
  placeOverlays(glide);
}
// 選單、狀態卡貼在角色旁邊（窄螢幕由 CSS 固定在戰場底部）
function placeOverlays(glide){
  const wrap = document.querySelector(".board-wrap"); if(!wrap) return;
  const narrow = window.innerWidth < 560, z = camZoom(), c = B().cam;
  wrap.querySelectorAll(".bt-ov[data-anchor]").forEach(el=>{
    if(narrow){ el.style.left = el.style.top = ""; return; }
    const v = B().units.find(x=>x.id===el.dataset.anchor); if(!v) return;
    if(el.classList.contains("gear-info")){
      const r=el.getBoundingClientRect();
      const w=r.width,h=r.height,W=wrap.clientWidth,H=wrap.clientHeight;
      const left=Math.max(12,Math.min(W-w-12,Math.round(W*.12)));
      const top=Math.max(8,Math.min(H-h-8,Math.round((H-h)/2)));
      el.style.transition=glide?"left .25s ease, top .25s ease":"";
      el.style.left=left+"px"; el.style.top=top+"px";
      return;
    }
    const p = iso(v.x, v.y), ux = c.x + p.x*z, uy = c.y + (p.y+TH/2)*z;
    const w = el.offsetWidth, h = el.offsetHeight, W = wrap.clientWidth, H = wrap.clientHeight, gap = 44*z + 12;
    let left = ux + gap; if(left + w > W - 8) left = ux - gap - w;       // 右邊放不下就放左邊
    left = Math.max(8, Math.min(W - w - 8, left));
    const top = Math.max(8, Math.min(H - h - 8, uy - 60*z - h/2));
    el.style.transition = glide ? "left .35s ease, top .35s ease" : "";
    el.style.left = left + "px"; el.style.top = top + "px";
  });
}
// 把某個格子（可給小數）移到畫面中央
function centerCam(x, y, glide){
  const wrap = document.querySelector(".board-wrap"); if(!wrap) return;
  const p = iso(x, y), z = camZoom();
  B().cam = clampCam({x: wrap.clientWidth/2 - p.x*z, y: wrap.clientHeight/2 - (p.y+TH/2-40)*z});
  applyCam(glide);
}
// 角色整隻（含頭頂血條）有沒有在畫面裡，邊緣留一點空間
function onScreen(v){
  const wrap = document.querySelector(".board-wrap"); if(!wrap) return true;
  const p = iso(v.x, v.y), z = camZoom(), c = B().cam, m = 24;
  const x = c.x + p.x*z, top = c.y + (p.y+TH/2-130)*z, bot = c.y + (p.y+TH/2)*z;
  return x > m && x < wrap.clientWidth - m && top > m && bot < wrap.clientHeight - m;
}
// 以畫面上某一點（相對戰場視窗的座標）為中心縮放
function zoomAt(z, px, py){
  const b = B(), f = {z:camZoom(), cam:b.cam};
  const nz = clampZoom(z);
  const bx = (px - f.cam.x)/f.z, by = (py - f.cam.y)/f.z;   // 這點在地圖上的原始座標
  b.zoom = nz;
  b.cam = clampCam({x: px - bx*nz, y: py - by*nz});
  applyCam();
}

const touches = new Map();   // pointerId → {x,y}
let drag = null, pinch = null;
// 特效到期就從畫面移除（不靠 CSS 動畫最後一格變透明：減少動態效果、背景分頁時動畫可能不會播完）
function sweepFx(){
  const now = Date.now();
  document.querySelectorAll(".board [data-exp]").forEach(e=>{ if(+e.dataset.exp < now) e.remove(); });
}
function wrapXY(e){ const r = document.querySelector(".board-wrap").getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function startPinch(){
  const [p1, p2] = [...touches.values()];
  pinch = {d:Math.hypot(p1.x-p2.x, p1.y-p2.y) || 1, mx:(p1.x+p2.x)/2, my:(p1.y+p2.y)/2, z:camZoom(), cam:{...B().cam}};
}
function initBoardDrag(){
  if(initBoardDrag.done) return; initBoardDrag.done = true;
  setInterval(()=>{ sweepFx(); refreshLogStrip(); }, 100);
  window.addEventListener("pointerdown", e=>{
    const wrap = e.target.closest && e.target.closest(".board-wrap");
    if(!wrap || !B() || e.target.closest(".bt-ov, .bt-logstrip") || (e.pointerType==="mouse" && e.button!==0)) return;
    // 第一根手指放下＝前面的手指一定都離開了。畫面重畫時手指按著的元素會被換掉，
    // 手機（尤其 iPhone）之後的放開事件送不到 window，留下「幽靈手指」讓下一次單指拖曳變成縮放
    if(e.isPrimary && (touches.size || pinch || drag)){ touches.clear(); pinch = null; drag = null; document.body.classList.remove("board-dragging"); }
    touches.set(e.pointerId, wrapXY(e));
    if(touches.size===2){ drag = null; startPinch(); return; }     // 第二根手指放下 → 改成縮放，不算點格子
    if(touches.size>2) return;
    const t = e.target.closest("[data-tile]");
    drag = {id:e.pointerId, sx:e.clientX, sy:e.clientY, c:{...(B().cam||{x:0,y:0})}, moved:false, tile:t && t.dataset.tile};
  });
  window.addEventListener("pointermove", e=>{
    if(!touches.has(e.pointerId)) return;
    touches.set(e.pointerId, wrapXY(e));
    if(pinch && touches.size>=2){
      const [p1, p2] = [...touches.values()];
      const d = Math.hypot(p1.x-p2.x, p1.y-p2.y), mx = (p1.x+p2.x)/2, my = (p1.y+p2.y)/2;
      // 兩指剛放下時中點底下的那塊地圖，永遠跟著兩指中點走（同時縮放＋平移）
      const b = B(), nz = clampZoom(pinch.z*d/pinch.d);
      const bx = (pinch.mx - pinch.cam.x)/pinch.z, by = (pinch.my - pinch.cam.y)/pinch.z;
      b.zoom = nz; b.cam = clampCam({x: mx - bx*nz, y: my - by*nz}); applyCam();
      e.preventDefault(); return;
    }
    if(!drag || e.pointerId!==drag.id) return;
    const dx = e.clientX-drag.sx, dy = e.clientY-drag.sy;
    if(!drag.moved && Math.hypot(dx,dy) > DRAG_TOL){ drag.moved = true; document.body.classList.add("board-dragging"); }
    if(drag.moved){ B().cam = clampCam({x:drag.c.x+dx, y:drag.c.y+dy}); applyCam(); e.preventDefault(); }
  }, {passive:false});
  const up = e=>{
    if(!touches.has(e.pointerId)) return;
    touches.delete(e.pointerId);
    if(pinch){
      if(touches.size<2){ pinch = null;
        // 放開一指後，剩下那指接著拖（不會誤點）
        const rest = [...touches.entries()][0];
        if(rest){ const r = document.querySelector(".board-wrap").getBoundingClientRect();
          drag = {id:rest[0], sx:rest[1].x+r.left, sy:rest[1].y+r.top, c:{...B().cam}, moved:true, tile:null}; }
        else { drag = null; document.body.classList.remove("board-dragging"); }
      } else startPinch();
      return;
    }
    if(!drag || e.pointerId!==drag.id) return;
    const d = drag; drag = null; document.body.classList.remove("board-dragging");
    if(e.type==="pointerup" && !d.moved && d.tile){
      if(e.pointerType!=="mouse") ghostUntil = Date.now() + 400;
      const [x,y] = d.tile.split(",").map(Number); clickTile(x,y);
    }
  };
  // 手機點格子：放開手指時選單就畫出來了，瀏覽器接著補發的 click 會重新找手指底下的元素，
  // 剛好落在新冒出來的選單按鈕上（一次點擊按到兩下）。這一下吃掉，只吃選單上的、只吃一次
  let ghostUntil = 0;
  window.addEventListener("click", e=>{
    if(Date.now() > ghostUntil) return;
    ghostUntil = 0;
    if(e.target.closest && e.target.closest(".bt-ov")){ e.preventDefault(); e.stopPropagation(); }
  }, true);
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
  // 滾輪縮放（以游標為中心）；在戰場上滾輪不捲頁面
  window.addEventListener("wheel", e=>{
    const wrap = e.target.closest && e.target.closest(".board-wrap");
    if(!wrap || !B() || e.target.closest(".bt-ov, .bt-logstrip")) return;
    e.preventDefault();
    const dy = e.deltaMode===1 ? e.deltaY*16 : e.deltaY;
    const p = wrapXY(e);
    zoomAt(camZoom()*Math.exp(-dy*.0015), p.x, p.y);
  }, {passive:false});
  window.addEventListener("resize", ()=>{ if(B() && document.querySelector(".board-wrap")){ render(); } });
}

// 掉在地上的武器：用拿在手上的同一張圖，躺在地上；剛被打飛時從原主身上拋過來
function dropSVG(dp){
  const p = iso(dp.x, dp.y), cx = p.x, cy = p.y + TH/2;
  const h = HELD[dp.group] || {}, s = (h.s ?? .4) * 1.1, gx = h.gx ?? 60, gy = h.gy ?? 90;
  const art = ITEM_RAW[dp.group] || "";
  const f = iso(dp.fx, dp.fy), sx = f.x - cx, sy = (f.y + TH/2 - 60) - cy;
  const el = Date.now() - dp.t, flying = el < 550;
  const st = flying ? `style="--sx:${sx}px;--sy:${sy}px;animation-delay:${-el}ms"` : "";
  return `<g class="drop ${flying?"flying":""}" ${st}>
    <ellipse cx="${cx}" cy="${cy+2}" rx="26" ry="9" fill="#000" opacity=".22"/>
    <g class="drop-glint"><ellipse cx="${cx}" cy="${cy}" rx="30" ry="12" fill="none" stroke="#f2b441" stroke-width="2" opacity=".7"/></g>

function rangeOutline(u, r){
  const d = B().def, inR = (x,y) => Math.max(Math.abs(x-u.x), Math.abs(y-u.y)) <= r;
  const inMap = (x,y) => x>=0 && y>=0 && x<d.w && y<d.h;
  const segs = [];
  for(let x=Math.max(0,u.x-r); x<=Math.min(d.w-1,u.x+r); x++) for(let y=Math.max(0,u.y-r); y<=Math.min(d.h-1,u.y+r); y++){
    const p = iso(x,y), T=[p.x,p.y], R=[p.x+TW/2,p.y+TH/2], Bm=[p.x,p.y+TH], L=[p.x-TW/2,p.y+TH/2];
    // 四個鄰格：在地圖內但超出射程 → 這條邊是射程邊界
    [[1,0,R,Bm],[-1,0,T,L],[0,1,Bm,L],[0,-1,T,R]].forEach(([dx,dy,a,c])=>{
      if(inMap(x+dx,y+dy) && !inR(x+dx,y+dy)) segs.push(`M${a[0]} ${a[1]} L${c[0]} ${c[1]}`);
    });
  }
  if(!segs.length) return "";
  const path = segs.join(" ");
  return `<g class="range-line"><path d="${path}" stroke="#2a2630" stroke-width="8" stroke-linecap="round" fill="none" opacity=".45"/>
    <path d="${path}" stroke="#ff8a7a" stroke-width="4" stroke-linecap="round" fill="none"/></g>`;
}

// 被動觀察符號：白色泡泡框，錨點跟台詞氣泡框一樣在頭上；大小見 overlayK

  const p = iso(v.x, v.y), ax = p.x, ay = p.y + TH/2 - ((v.down || has(v,"prone")) ? 66 : 134) - (v.statuses.some(s=>STATUS_BADGE[s.k]) ? 38*overlayK() : 0);
  const k = overlayK(), d = m.t - now, w = 42, h = 38, L = -w/2, T = -h - 9;   // 三種符號同一個泡泡框大小
  const bubble = `<path d="M${L+10} ${T} H${-L-10} Q${-L} ${T} ${-L} ${T+10} V${T+h-10} Q${-L} ${T+h} ${-L-10} ${T+h} H7 L0 ${T+h+9} L-7 ${T+h} H${L+10} Q${L} ${T+h} ${L} ${T+h-10} V${T+10} Q${L} ${T} ${L+10} ${T} Z"
      fill="#fff" stroke="#2a2630" stroke-width="2.5" stroke-linejoin="round"/>`;
  let inner;
  if(m.kind==="ok") inner = `<text x="0" y="${T+h/2+11}" text-anchor="middle" class="obs-glyph" fill="#e0453a">!</text>`;
  else if(m.kind==="fail") inner = `<text x="0" y="${T+h/2+11}" text-anchor="middle" class="obs-glyph" fill="#3d7fd9">?</text>`;
  else inner = [-11,0,11].map((x,i)=>`<circle class="obs-dot" cx="${x}" cy="${T+h/2}" r="3.5" fill="#1f1a24" style="animation-delay:${d + 350 + i*420}ms"/>`).join("");

}

// 後面那個（a）被前面那個（f）蓋住的比例

  const w = Math.min(a[2],f[2]) - Math.max(a[0],f[0]), h = Math.min(a[3],f[3]) - Math.max(a[1],f[1]);
  return w>0 && h>0 ? (w*h) / ((a[2]-a[0])*(a[3]-a[1])) : 0;
}

  return sk.def.free ? (B() && u===cur() && !freeLeft() ? "用動作" : "免費動作") : "";
}
function skillBtn(u, sk, label){

  const locked = fromTwoHanded(u, sk) && inGrapple(u);
  const off = passive || !skillReady(u, sk) || !skillCanUse(u, sk) || locked;

function aimHTML(u, b){

function isTwoHand(it){ return !!(it && it.props && it.props.includes("雙手")); }
function syncWeaponSet(u){
  u.activeSet=u.activeSet===2?2:1;
  if(u.activeSet===1){
    if(isTwoHand(u.weapon)) u.shield=false;
  }else{
    if(isTwoHand(u.spare&&u.spare[0])) u.offhand2=null;
  }
}
function switchWeaponSet(u,set){
  if(!u||u.side!=="pc")return;
  u.activeSet=set===2?2:1;
  // 戰鬥實際使用欄位永遠指向目前配置；切組不消耗任何動作。
  if(u.activeSet===2){
    const a=u.weapon, b=u.spare&&u.spare[0]||null;
    u.weapon=b; u.spare[0]=a;
    const sh=u.shield; u.shield=!!u.offhand2; u.offhand2=sh?{n:"盾牌",type:"shield",_shield:true}:null;
    u.activeSet=1; // 交換後目前組仍以 UI 的配置Ⅰ代表
  }
  syncWeaponSet(u);
}
function equipItemAt(u, from, to){
  if(!u || u.side!=="pc") return false;
  u.backpack=u.backpack||[]; u.spare=u.spare||[]; u.accessories=u.accessories||[];
  const shieldObj=()=>({n:"盾牌",type:"shield",_shield:true});
  const get=slot=>{
    if(slot==="weapon1")return u.weapon||null;
    if(slot==="weapon2")return u.spare[0]||null;
    if(slot==="offhand1")return u.shield?shieldObj():null;
    if(slot==="offhand2")return u.offhand2||null;
    if(slot==="armor")return u.armor||null;
    if(slot==="acc1")return u.accessories[0]||null;
    if(slot==="acc2")return u.accessories[1]||null;
    if(slot==="backpack")return u.backpackEquip||null;
    if(slot.startsWith("bag:"))return u.backpack[+slot.slice(4)]||null;
    return null;
  };
  const accepts=(slot,it)=>{
    if(!it)return true;
    if(slot==="weapon1"||slot==="weapon2")return it.type==="weapon"||it.type==="focus";
    if(slot==="offhand1"||slot==="offhand2")return it.type==="shield";
    if(slot==="armor")return it.type==="armor";
    if(slot==="acc1"||slot==="acc2")return it.type==="accessory";
    if(slot==="backpack")return it.type==="gear" && it.n==="背包";
    if(slot==="bag")return true;
    return false;
  };
  const take=slot=>{
    const it=get(slot); if(!it)return null;
    if(slot==="weapon1")u.weapon=null;
    else if(slot==="weapon2")u.spare.splice(0,1);
    else if(slot==="offhand1")u.shield=false;
    else if(slot==="offhand2")u.offhand2=null;
    else if(slot==="armor")u.armor=null;
    else if(slot==="acc1")u.accessories.splice(0,1);
    else if(slot==="acc2")u.accessories.splice(1,1);
    else if(slot==="backpack")u.backpackEquip=null;
    else if(slot.startsWith("bag:"))u.backpack.splice(+slot.slice(4),1);
    return it;
  };
  const put=(slot,it)=>{
    if(!it)return;
    if(slot==="weapon1")u.weapon=it;
    else if(slot==="weapon2")u.spare[0]=it;
    else if(slot==="offhand1")u.shield=true;
    else if(slot==="offhand2")u.offhand2=it;
    else if(slot==="armor")u.armor=it;
    else if(slot==="acc1")u.accessories[0]=it;
    else if(slot==="acc2")u.accessories[1]=it;
    else if(slot==="backpack")u.backpackEquip=it;
    else if(slot==="bag")u.backpack.push(it);
  };
  const a=get(from); if(!a)return false;
  const target=to==="bag"?null:get(to);
  if(!accepts(to,a)||(target&&!accepts(from.startsWith("bag:")?"bag":from,target)))return false;
  const moving=take(from);
  if(to==="bag")put("bag",moving);
  else{
    const displaced=take(to); put(to,moving);
    if(displaced){ if(from.startsWith("bag:"))put("bag",displaced); else put(from,displaced); }
  }
  // 雙手武器獨佔整組；裝上時該組副手自動收回背包。
  if((to==="weapon1"||from==="weapon1") && isTwoHand(u.weapon) && u.shield){u.backpack.push(shieldObj());u.shield=false;}
  if((to==="weapon2"||from==="weapon2") && isTwoHand(u.spare[0]) && u.offhand2){u.backpack.push(u.offhand2);u.offhand2=null;}
  syncBattleBag(u);
  blog(`${u.name}整理了裝備`,"skill");
  return true;
}
function bindGearDrag(){
  let drag=null, ghost=null, over=null, sx=0, sy=0;
  document.querySelectorAll("[data-gearitem]").forEach(el=>{
    el.addEventListener("pointerdown",e=>{
      if(e.button!==undefined&&e.button!==0)return;
      drag={uid:el.dataset.uid,from:el.dataset.gearitem}; sx=e.clientX; sy=e.clientY;
      const move=ev=>{
        if(!ghost){
          if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<5)return;
          ghost=el.cloneNode(true); ghost.classList.add("gear-ghost"); document.body.appendChild(ghost); el.classList.add("gear-lift");
        }
        ghost.style.left=ev.clientX+"px"; ghost.style.top=ev.clientY+"px";
        const t=document.elementFromPoint(ev.clientX,ev.clientY)?.closest("[data-gearslot],[data-gearbag]");
        if(over!==t){over?.classList.remove("gear-over");t?.classList.add("gear-over");over=t;}
        ev.preventDefault();
      };
      const up=ev=>{
        window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);
        const didDrag=!!ghost;
        ghost?.remove(); ghost=null; el.classList.remove("gear-lift"); over?.classList.remove("gear-over");
        const t=document.elementFromPoint(ev.clientX,ev.clientY)?.closest("[data-gearslot],[data-gearbag]");
        // 單純點擊裝備圖示不是拖曳。只有真的移動到拖曳門檻後才執行換裝，
        // 否則像背包圖示的 click 會在 pointerup 時被 render() 吃掉，導致背包無法打開。
        if(didDrag&&t&&drag){
          const b=B(),u=b&&b.units.find(x=>x.id===drag.uid);
          const to=t.dataset.gearslot||"bag";
          if(equipItemAt(u,drag.from,to)){ b.info=u.id; render(); }
        }
        drag=null;over=null;
      };
      window.addEventListener("pointermove",move,{passive:false});window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
    });
  });
}

        : `<div class="note-skill-row"><div class="note-skill-main"><span class="sk-n">${n.name}</span></div></div>`;

  }
  let statusPage="";
  if(v.side==="pc"){
    const abilities=`<div class="status-abilities">${ABILITIES.map(a=>{const n=finalScore(v.id,a.k),m=modOf(n);return `<div class="status-ability"><small>${a.n}</small><b>${n}</b><span>${m>=0?"+":""}${m}</span></div>`}).join("")}</div>`;
    const sh1=v.shield?{n:"盾牌",type:"shield",id:"shield",wt:6}:null;
    const armorIcon=it=>`<svg class="status-armoricon" viewBox="38 76 64 66" width="42" height="42" aria-hidden="true">${armorSVG(it.n)}</svg>`;
    const eqIcon=it=>{if(!it)return `<span class="status-eqempty">＋</span>`;if(it.type==="armor")return armorIcon(it);if(it.type==="gear"&&it.n==="背包")return `<svg viewBox="0 0 120 120" width="42" height="42" aria-hidden="true">${ITEM_ART.backpack||ITEM_RAW.backpack}</svg>`;const g=groupOf(it);return g?iconSVG(g.id,38):`<span class="eq-text">${it.n}</span>`};
    const eqTip=it=>it?`${it.n}\n${it.cat||it.type||"裝備"}${it.wt!=null?`・${it.wt} lb`:""}`:"空裝備格";
    const eqSlot=(slot,it,label,cls,extra="")=>`<div class="status-eqslot ${cls}" data-gearslot="${slot}"><small>${label}</small>${it?`<button class="status-eqitem eq-tip" data-uid="${v.id}" data-gearitem="${slot}" data-tip="${eqTip(it)}" data-iteminfo="${it.id||""}">${eqIcon(it)}</button>`:eqIcon(null)}${extra}</div>`;
    const carried=[v.weapon,v.spare&&v.spare[0],sh1,v.offhand2,v.armor,...(v.accessories||[]),v.backpackEquip,...(v.backpack||[])].filter(Boolean);
    const load=carried.reduce((sum,it)=>sum+(Number(it.wt)||0),0), cap=finalScore(v.id,"STR")*15, loadPct=Math.min(100,cap?load/cap*100:0);
    const bagOpen=!!b.gearBagOpen;
    const bagIt=v.backpackEquip||null;
    const bag=`<div class="status-eqslot backpack ${bagOpen?"on":""}" data-gearslot="backpack"><small>背包</small>${bagIt?`<button class="status-eqitem status-bagbtn eq-tip" data-bagtoggle data-uid="${v.id}" data-gearitem="backpack" data-tip="${eqTip(bagIt)}" aria-label="${bagOpen?"收起":"打開"}背包"><svg viewBox="0 0 120 120" aria-hidden="true">${ITEM_ART.backpack||ITEM_RAW.backpack}</svg></button>`:`<span class="status-eqempty">＋</span>`}</div>`;
    const bagDrawer=bagOpen?`<div class="status-bagdrawer gear-bag" data-gearbag><div class="gear-load"><div class="gear-load-head"><span>負重</span><b>${+load.toFixed(1)} / ${cap} lb</b></div><div class="gear-load-track"><div class="gear-load-fill" style="width:${loadPct}%"></div></div></div><div class="gear-bagitems">${(v.backpack||[]).map((it,i)=>{const g=groupOf(it);return `<button class="gear-item eq-tip" data-uid="${v.id}" data-gearitem="bag:${i}" data-iteminfo="${it.id||""}" data-tip="${eqTip(it)}">${g?iconSVG(g.id,24):""}<span>${it.n}</span></button>`}).join("")||`<span class="gear-empty bag-drop">背包是空的；可把裝備拖到這裡</span>`}</div></div>`:"";
    statusPage=`<div class="status-page"><div class="status-loadout"><div class="status-paper">${statusBadgeHTML}${statusPop}${doll}</div>${bag}${eqSlot("acc1",v.accessories&&v.accessories[0],"飾Ⅰ","acc1")}${eqSlot("acc2",v.accessories&&v.accessories[1],"飾Ⅱ","acc2")}${eqSlot("armor",v.armor,"身體","armor")}${eqSlot("weapon1",v.weapon,"主手","main",`<button class="status-switch" data-switchset title="切換武器配置" aria-label="切換武器配置">↻</button>`)}${isTwoHand(v.weapon)?`<div class="status-eqslot off locked" data-gearslot="offhand1"><small>副手</small><span class="gear-empty">雙手</span></div>`:eqSlot("offhand1",sh1,"副手","off")}</div>${bagDrawer}${abilities}</div>`;
  }
  const pageBody=v.side==="pc"?(page==="notes"?notes:statusPage):gear;
  return `<div class="bt-ov bt-info gear-info ${v.side==="pc"?(page==="status"?"status-view":"notes-view"):""}" data-anchor="${v.id}" style="--c:${v.side==="npc"?sideColor(v):v.side==="pc"?v.color:"var(--bad)"};--info-scale:${page==="status"?(b.infoScale||1):1}">

// ---------- 戰鬥紀錄 ----------
// 把紀錄整理成「事件」：一行開頭（誰做了什麼）＋底下細節裡的短結果（命中、8 點穿刺、倒地……）
function logEvents(log){
  const ev = [];
  for(const l of log){
    if(!l.t.startsWith("　")){ if(l.cls!=="turn") ev.push({head:l.t, cls:l.cls, parts:[]}); continue; }
    const last = ev[ev.length-1]; if(!last) continue;
    const s = l.s || (["skill","heal","dmg"].includes(l.cls) ? l.t.trim() : "");
    if(s) last.parts.push({s, cls:l.cls});
  }
  return ev;
}
// 戰鬥紀錄三段（大爺定的）：b.logLv 0＝3 行（預設）→ 1＝6 行 → 2＝完整紀錄（10 行高、有擲骰細節、可捲動）→ 再點回 3 行
// 手機、電腦都在戰場左下；指令選單、瞄準列、移動確認、狀態卡打開時紀錄讓位，關掉後回到原本的段數
const LOG_HINT = ["展開 ▴", "完整紀錄 ▴"];
// 「3 行」「6 行」是字的行數（大爺：預設要能完整看到三行）：長的句子換行完整顯示，最新的貼在最下面，舊的從上面推出去
function logStripRows(b){
  const shown = b.log.filter(logDue);
  b._stripN = shown.length;
  const ev = logEvents(shown).slice(-6);             // 最多 6 件就夠填滿 6 行；多的反正會被推出去
  if(!ev.length) return "";
  return `<div class="ls-lines">${ev.map((e,i)=>`<div class="ls-ev lg-${e.cls||""}" style="opacity:${(.45 + .55*(i+1)/ev.length).toFixed(2)}">
    <span class="ls-h">${e.head}</span>${e.parts.length ? `<span class="ls-a">→</span>${e.parts.map(p=>`<span class="lg-${p.cls}">${p.s}</span>`).join("，")}` : ""}</div>`).join("")}</div>`
    + `<span class="ls-more">${LOG_HINT[b.logLv||0]}</span>`;
}
function logStripHTML(b){
  const rows = logStripRows(b);
  return rows ? `<button class="bt-logstrip lv${b.logLv||0}" id="logOpen" aria-label="${b.logLv===1 ? "打開完整戰鬥紀錄" : "展開戰鬥紀錄"}" aria-live="polite">${rows}</button>` : "";
}
// 打中的那一刻才補上結果：有新的紀錄到時間了就只重畫縮小條的內容（按鈕本身不換，點擊照常）
// 縮小條捲到最新（字少時本來就在最上面，捲不動；滿了才會捲到底）
function stripToEnd(){ const box = document.querySelector(".bt-logstrip .ls-lines"); if(box) box.scrollTop = box.scrollHeight; }
function refreshLogStrip(){
  const b = B(); if(!b) return;
  const el = document.querySelector(".bt-logstrip"), lb = document.getElementById("logBody");
  if(b.log.filter(logDue).length === b._stripN) return;
  if(el){ el.innerHTML = logStripRows(b); stripToEnd(); }
  if(lb){ lb.innerHTML = logPanelRows(b); if(b.logStick!==false) lb.scrollTop = lb.scrollHeight; }
}
function logPanelRows(b){
  const shown = b.log.filter(logDue); b._stripN = shown.length;
  return shown.map(l=>`<div class="lg ${l.cls?"lg-"+l.cls:""} ${l.t.startsWith("　")?"lg-d":""}">${l.t}</div>`).join("");
}
function logPanelHTML(b){
  return `<div class="bt-ov bt-logpanel" id="logPanel" role="button" aria-label="收回戰鬥紀錄">
    <div class="lp-head"><b>戰鬥紀錄</b><button class="inf-x" id="logClose" aria-label="收回紀錄">✕</button></div>
    <div class="lp-body" id="logBody">${logPanelRows(b)}</div></div>`;
}


function restChoiceHTML(b){
  const pcs=b.units.filter(u=>u.side==="pc"), ling=pcs.find(u=>u.id==="fox"), teach=(ling&&ling.learned)||[];
  const rows=pcs.map(u=>{ const pend=u.pendingLearned||[], cap=noteCap(u.id), teachable=u.id!=="fox"?teach.filter(x=>!(u.learned||[]).some(y=>y.key===x.key)&&!pend.some(y=>y.key===x.key)):[]; return `<div class="rest-unit"><b>${u.name}　小筆記 ${u.learned.length}/${cap}</b>${pend.length?pend.map(x=>`<label class="rest-skill"><input type="checkbox" data-restpick="${u.id}:${x.key}" checked> ${x.name}</label>`).join(""):`<small>這次沒有待抄的招式</small>`}${teachable.length?`<small>向玲玲學（使用同一套學習檢定）：</small>${teachable.map(x=>`<button class="btn small ghost" data-teach="${u.id}:${x.key}">${x.name}</button>`).join("")}`:""}${u.learned.length>=cap?`<small>筆記已滿；先用橡皮擦空出位置。</small>${u.learned.map(x=>`<button class="btn small ghost" data-erase="${u.id}:${x.key}">橡皮擦：${x.name}</button>`).join("")}`:""}</div>`; }).join("");
  return `<div class="rest-box"><h4>休息與抄筆記</h4>${rows}<div class="rest-actions"><button class="btn small" id="shortRest" ${state.shortRestsUsed>=2?"disabled":""}>短休：熟練回一半（今日 ${state.shortRestsUsed}/2）</button><button class="btn small" id="longRest">長休：熟練回滿</button></div></div>`;
}

function renderBattle(){

  // 上方狀態列：輪到誰、行動經濟、提示

      ${b.result==="win" && !b.restDone ? restChoiceHTML(b) : ""}

  } else {
    const iv = b.info && b.units.find(v=>v.id===b.info);

  }
  // 右下角指令列：我方回合一直在（演出中變淡、不能按）；敵人回合收起來不擋畫面
  let dock = "";
  const mine = u.side==="pc" && !b.result;
  if(mine){
    if(b.pendingMove && !b.busy) dock = confirmHTML(u, b);
    else if(b.mode && !b.busy) dock = aimHTML(u, b);

  const deep = mine && !b.busy && (b.pendingMove || b.mode || b.moveMode || (b.menu && b.menu!=="root"));
  const logEl = b.result || deep || ov ? "" : b.logLv===2 ? logPanelHTML(b) : logStripHTML(b);
  const bottom = `<div class="bt-bottom">${dock?`<div class="bt-dockrow">${dock}</div>`:""}<div class="bt-resrow">${mine?resHTML(u,b):""}</div>${logEl}</div>`;

  return `<section class="page battle">

        <button class="gear-btn" id="gearToggle" aria-label="主選單" title="主選單"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.1.4.3.7.6 1 .3.3.7.4 1.1.4h.1v4h-.1c-.4 0-.8.1-1.1.4-.3.3-.5.6-.6 1.2Z"/></svg></button>
        ${b.sysPop==="volume"?`<div class="vol-pop" id="volPop"><button class="snd ${SFX.isMuted()?"off":""}" id="volMute" aria-label="靜音切換"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/></svg></button><input id="masterVolume" type="range" min="0" max="100" value="${Math.round(SFX.getVolume()*100)}" aria-label="主音量"><span class="vol-num" id="volNum">${SFX.isMuted()?0:Math.round(SFX.getVolume()*100)}%</span></div>`:""}
        ${b.sysPop==="menu"?`<div class="sys-menu" id="sysMenu"><h3>主選單</h3><button data-sys="continue">繼續遊戲</button><button data-sys="party">隊伍</button><button data-sys="title">回到標題</button></div>`:""}
      </div></div>
    <div class="order">${order}</div>

function clampInfoScale(z){ return Math.max(.75,Math.min(1.35,z)); }
let infoPinch=null, infoTouches=new Map();
function initInfoZoom(){
  if(initInfoZoom.done) return; initInfoZoom.done=true;
  window.addEventListener("wheel",e=>{
    const el=e.target.closest&&e.target.closest(".gear-info.status-view"); if(!el||!B()) return;
    e.preventDefault(); e.stopPropagation();
    const dy=e.deltaMode===1?e.deltaY*16:e.deltaY;
    B().infoScale=clampInfoScale((B().infoScale||1)*Math.exp(-dy*.0015));
    el.style.setProperty("--info-scale",B().infoScale); placeOverlays(false);
  },{passive:false,capture:true});
  window.addEventListener("pointerdown",e=>{
    const el=e.target.closest&&e.target.closest(".gear-info.status-view");
    if(!el||e.pointerType==="mouse"||e.target.closest(".gear-bagitems,.gear-item,.status-eqitem,button,input")) return;
    infoTouches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(infoTouches.size===2){ const [a,b]=[...infoTouches.values()]; infoPinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:B().infoScale||1}; }
  });
  window.addEventListener("pointermove",e=>{
    if(!infoTouches.has(e.pointerId)) return; infoTouches.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(infoPinch&&infoTouches.size>=2){ const [a,b]=[...infoTouches.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); B().infoScale=clampInfoScale(infoPinch.z*d/infoPinch.d); const el=document.querySelector(".gear-info.status-view"); if(el){el.style.setProperty("--info-scale",B().infoScale);placeOverlays(false);} e.preventDefault(); }
  },{passive:false});
  const end=e=>{ if(!infoTouches.has(e.pointerId))return; infoTouches.delete(e.pointerId); if(infoTouches.size<2)infoPinch=null; };
  window.addEventListener("pointerup",end); window.addEventListener("pointercancel",end);
}

function bindBattle(){
  initBoardDrag(); initInfoZoom();
  const b = B();
  if(b && !b.cam){ const ps = b.units.filter(v=>v.side==="pc"); centerCam(ps.reduce((a,v)=>a+v.x,0)/ps.length, ps.reduce((a,v)=>a+v.y,0)/ps.length - 2); }
  else if(b){ b.cam = clampCam(b.cam); applyCam(); }
  if(b && b.focusReq && !b.result){ b.focusReq = false; const u = cur();
    if(u.side==="pc") centerCam(u.x, u.y - 1, true);
    else if(!touches.size && !foeHid(u) && !onScreen(u)) centerCam(u.x, u.y - 1, true); }

/* ======================== 詳情卡：裝備卡、技能卡（裝備店與戰鬥共用） ======================== */

// 技能圖示：類別圖示 + 角標（數字＝花幾點熟練點數、自＝自動觸發；普攻沒有角標）
function tierOf(def, impl){
  if(impl && impl.passive) return {tag:"自", label:"自動觸發", cls:"t-auto"};
  if(def.pts) return {tag:String(def.pts), label:`花 ${def.pts} 點熟練點數${def.free?"・免費動作":""}`, cls:"t-sig"};
  return {tag:"", label:`不花點數・隨時可用${def.free?"・免費動作":""}`, cls:"t-basic"};
}
function skillIcon(groupId, def, impl, size=22){
  const t = tierOf(def, impl);
  return `<span class="skicon ${t.cls}" style="--s:${size}px">${iconSVG(groupId, size-6)}${t.tag?`<i>${t.tag}</i>`:""}</span>`;
}

// 用裝備做一個假角色，算出射程等數字（裝備店裡沒有真正的角色）
function probeUnit(item, real){
  if(real) return real;
  return {side:"pc", weapon:item&&item.type==="weapon"?item:null, focus:item&&item.type==="focus"?item:null,
          shield:item&&item.type==="shield", mods:{STR:0,DEX:0,CON:0,INT:0,WIS:0,CHA:0}, statuses:[]};
}
const TARGET_TEXT = {enemy:"單一敵人", ally:"單一隊友", self:"自己（或自己周圍）", area:"指定一塊範圍", cone:"前方錐形", line:"一整條直線", shadow:"瞬移到敵人身旁"};
function skillStatText(group, item){
  if(item && item.type==="focus") return ABILITIES.find(a=>a.k===item.stat).n;
  if(group.id==="unarmed") return "力量";
  if(group.id==="shield") return "—";
  if(!item) return group.stat;
  if(item.props.some(p=>p.startsWith("彈藥"))) return "敏捷";
  if(item.props.includes("靈巧")) return "力量或敏捷（取高）";
  return "力量";
}

// ---------- 裝備卡 ----------
function itemCardHTML(it){
  const rows = [];
  if(it.type==="weapon"){
    rows.push(["傷害", it.dmg.split(" ")[0] + " 物理"]);   // 揮砍、穿刺、鈍擊都算物理
    it.props.forEach(p=>{ const k=p.split(" ")[0]; rows.push([p, PROP_TEXT[k]||""]); });
    const m = it.mastery.split(" ")[0];
    rows.push([`專精：${it.mastery}`, MASTERY_TEXT[m]||""]);
  } else if(it.type==="armor"){
    rows.push(["護甲等級", `AC ${it.ac}${it.dex==="full"?" + 敏捷調整值":it.dex==="max2"?" + 敏捷調整值（最多 +2）":"（不加敏捷）"}`]);
    if(it.cloth) rows.push(["布甲", "不算穿護甲：法師護甲照樣可以用。"]);
    if(it.str) rows.push(["力量需求", `力量 ${it.str} 以上才能穿`]);
    if(it.stealth) rows.push(["潛行劣勢", TERM_TEXT["潛行劣勢"]]);
    rows.push(["技能", "護甲不給主動技能，只提高 AC。"]);
  } else if(it.type==="shield"){
    rows.push(["護甲等級", "AC +2"]);
  } else if(it.type==="focus"){
    rows.push(["施法屬性", ABILITIES.find(a=>a.k===it.stat).n]);
    rows.push(["說明", "拿著法器就能施放它綁定的三個法術。"]);
  } else if(it.type==="consumable"){
    rows.push(["效果", it.desc]);
    rows.push(["使用", "戰鬥中從「道具」選單使用，用掉免費動作（每回合一次）。用完就沒了。丟給貼身的隊友＝交給他。"]);
  } else {
    rows.push(["說明", "冒險用品，目前沒有戰鬥效果。"]);
  }
  rows.push(["價格／重量", `${money(it.cost)}／${it.wt} 磅`]);
  const g = groupOf(it);
  const on = g ? g.skills.map((s,i)=>({s,i})) : [];
  const skills = g ? `<h4 class="md-sub">${on.length===1?"給的技能":`給的${["","一","兩","三","四","五"][on.length]||on.length}個技能`}</h4>
    <div class="md-skills">${on.map(({s,i})=>{ const im=(SKILL_IMPL[g.id]||[])[i];
      return `<button class="md-sk" data-skinfo="${g.id}:${i}:${it.id}">${skillIcon(g.id,s,im,34)}<span>${s.name}</span><small>${tierOf(s,im).label.split("・")[0]}</small></button>`; }).join("")}</div>
    <p class="dim md-hint">點技能看詳細說明</p>` : "";
  return `<div class="md-head">${g?iconSVG(g.id,34):""}<div><h3>${it.n}</h3><div class="dim">${it.en}・${it.cat}</div></div></div>
    <dl class="md-rows">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>${skills}`;
}

// ---------- 技能卡 ----------
function skillCardHTML(groupId, idx, item, unit){
  const g = SKILL_GROUPS.find(x=>x.id===groupId), im = (SKILL_IMPL[groupId]||[])[idx];
  let s = g.skills[idx];
  if(idx===0 && HAS_BASIC(g) && g.id!=="shield")        // 基本攻擊名稱看武器；沒指定武器（技能總表）就列出這組可能的名稱
    s = {...s, name: g.id==="arcane_staff" || g.id==="unarmed" ? "打擊" : item && item.type==="weapon" ? basicName(g, item) : basicNames(g)};
  const t = tierOf(s, im);
  const u = probeUnit(item, unit);
  let range = "—";
  if(im && im.range){ const r = im.range(u); range = r<=1 ? "貼身（1 格）" : `${r} 格（${r*5} 呎）`; }
  const rows = [
    ["類型", skillType(g, s)],
    ["使用", t.label],
    ["目標", im && im.passive ? "條件符合時自動觸發" : TARGET_TEXT[im && im.target] || "—"],
    ["距離", im && im.passive ? "—" : range],
    ["屬性", skillStatText(g, item)]
  ];
  if(s.req) rows.push(["施展條件", REQ_TEXT[s.req]||s.req]);
  if(idx===0 && item && item.type==="weapon"){ const m=item.mastery.split(" ")[0]; rows.push([`專精：${m}`, MASTERY_TEXT[m]||""]); }
  if(s.pts) rows.push(["升環", s.noUp ? "不能升環" : s.up || "命中時每多花 1 點多 1 顆武器骰。"]);
  if(s.srd) rows.push(["出處", "SRD 5.2"]);
  return `<div class="md-head">${skillIcon(groupId,s,im,44)}<div><h3>${s.name}</h3></div></div>
    <p class="md-effect">${s.text}</p>
    ${unit && unit.pts!==undefined && s.pts ? `<p class="md-cd">${unit.name}還有 ${unit.pts} 點熟練點數</p>` : ""}
    <dl class="md-rows">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    ${item && state.modal && state.modal.back ? `<button class="btn small ghost" data-iteminfo="${item.id}">← 回到${item.n}</button>` : ""}`;
}

// ---------- 彈出視窗 ----------
function renderModal(){
  const m = state.modal; if(!m) return "";
  let body = "";
  if(m.kind==="item") body = itemCardHTML(ITEMS.find(i=>i.id===m.id));
  if(m.kind==="skill"){
    const unit = m.unit && state.battle ? state.battle.units.find(v=>v.id===m.unit) : null;
    body = skillCardHTML(m.group, m.idx, m.item ? ITEMS.find(i=>i.id===m.item) : null, unit);
  }
  return `<div class="modal-back" data-close="1"><div class="modal" role="dialog" aria-modal="true">
    <button class="md-x" data-close="1" aria-label="關閉">✕</button>${body}</div></div>`;
}
function bindModal(){
  document.querySelectorAll("[data-close]").forEach(el=>el.addEventListener("click", e=>{ if(e.target===el){ state.modal=null; render(); } }));
  document.querySelectorAll("[data-iteminfo]").forEach(el=>el.addEventListener("click", e=>{ if(!el.dataset.iteminfo)return; e.stopPropagation(); state.modal={kind:"item", id:el.dataset.iteminfo}; render(); }));
  document.querySelectorAll("[data-skinfo]").forEach(el=>el.addEventListener("click", e=>{
    e.stopPropagation();
    const [group, idx, item, unit] = el.dataset.skinfo.split(":");
    state.modal = {kind:"skill", group, idx:+idx, item:item||null, unit:unit||null, back: state.modal && state.modal.kind==="item"};
    render();
  }));
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && state.modal){ state.modal=null; render(); } });

// 全域返回／取消：滑鼠右鍵一律當作遊戲的「返回」鍵，不開瀏覽器選單。
// 只撤銷尚未確定的 UI／選擇；已經結算的攻擊、移動途中事件等不倒帶。
function gameBack(){
  if(state.modal){
    // 技能詳情若是從物品詳情進來，先回物品；否則關閉詳情。
    if(state.modal.kind==="skill" && state.modal.back && state.modal.item){
      state.modal={kind:"item",id:state.modal.item};
    }else state.modal=null;
    sfx("back"); render(); return true;
  }
  if(state.page==="battle"){
    const b=B(); if(!b || b.busy) return false;
    if(b.sysPop){ b.sysPop=null; sfx("back"); render(); return true; }
    if(b.gearBagOpen){ b.gearBagOpen=false; sfx("back"); render(); return true; }
    if(b.info){ b.info=null; sfx("back"); render(); return true; }
    if(b.pendingMove){ sfx("back"); confirmMove(false); return true; }
    if(b.mode){ aimCancel(); return true; }
    if(b.moveMode){ b.moveMode=false; b.menu="move"; sfx("back"); render(); return true; }
    if(b.menu && b.menu!=="root"){
      b.menu=["skills","shove"].includes(b.menu)?"act":"root";
      sfx("back"); render(); return true;
    }
    return false;
  }
  // 劇情角色小卡先收起，不直接跳頁。
  if(state.info){ state.info=null; sfx("back"); render(); return true; }
  // 其他頁面沿用畫面上既有的返回按鈕，避免另外維護第二套路徑。
  const back=document.querySelector("#backShop,#backStory,#back2,#back");
  if(back){ sfx("back"); back.click(); return true; }
  return false;
}
document.addEventListener("contextmenu", e=>{
  e.preventDefault();
  gameBack();
});

/* ======================== 流程 ======================== */
function render(){
  const app = document.getElementById("app");
  // 只有換頁（或換劇情場景）時才播淡入動畫，避免每次點擊都閃一下
  const key = state.page + ":" + state.scene;
  const entering = key !== render.last; render.last = key;
  app.innerHTML = state.page==="cover" ? renderCover() : state.page==="roll" ? renderRoll() : state.page==="shop" ? renderShop() : state.page==="map" ? renderMap() : state.page==="battle" ? renderBattle() : state.page==="doll" ? renderDollDemo() : renderStory();
  app.insertAdjacentHTML("beforeend", renderModal());
  if(entering) app.firstElementChild?.classList.add("enter");
  bind();
  bindModal();
}

// 大地圖：棋子沿路走到 stop 的位置停下，跳出驚嘆號，接著切到第一人稱伏擊劇情
function startTravel(){
  const tr = state.travel;
  let last = performance.now();
  const step = now=>{
    if(state.page!=="map" || state.travel!==tr) return;
    tr.t = Math.min(tr.stop, tr.t + (now-last)/4400);  // 整段路約 4.4 秒
    last = now;
    const p = roadPoint(tr.from, tr.to, tr.t);
    document.getElementById("party-marker")?.setAttribute("transform", `translate(${p.x} ${p.y})`);
    if(tr.t < tr.stop){ requestAnimationFrame(step); return; }
    tr.alert = true; render();
    setTimeout(()=>{
      if(state.travel!==tr) return;
      scoutBattle("ambush");
      state.travel = null; state.page = "story"; state.scene = "ambush"; state.line = 0; state.info = null;
      render(); window.scrollTo(0,0);
    }, 1500);
  };
  requestAnimationFrame(step);
}

// 屬性變了，已買的裝備可能不再符合限制：全部退貨重挑
function resetGear(c){
  if(state.inv[c.id] && state.inv[c.id].length){
    state.inv[c.id] = []; state.gold[c.id] = 100*GP;
    state.quip = `${c.name}屬性變了？裝備全退回來，錢拿去重挑！`;
  }
}
// 由格子分配同步出 state.rolls（規則函式都讀 rolls）
function syncRolls(id){
  const r = {};
  ABILITIES.forEach(a=>{ const i = state.slot[id][a.k]; if(i!==null && i!==undefined) r[a.k] = state.sets[id][i]; });
  state.rolls[id] = r;
}
// 擲 6 組 4d6（取高三），再由玩家分配
function rollAll(){
  const c = CRITTERS[state.active];
  state.sets[c.id] = ABILITIES.map(()=>roll4());
  state.slot[c.id] = {};
  state.sel = null;
  syncRolls(c.id);
  resetGear(c);
  // 不演 4d6：玩家只在意最後的數字和怎麼分配（大爺決定），直接跳出 6 個數字籌碼
  render();
}
// 自動分配：最高的給背景 +2、次高給 +1，其餘依 力量→魅力 的順序由高到低填入
function autoAssign(){
  const c = CRITTERS[state.active];
  const sets = state.sets[c.id];
  const order = Object.keys(c.bg).sort((a,b)=>c.bg[b]-c.bg[a]);
  ABILITIES.forEach(a=>{ if(!order.includes(a.k)) order.push(a.k); });
  const byHigh = sets.map((_,i)=>i).sort((a,b)=>scoreOf(sets[b])-scoreOf(sets[a]));
  state.slot[c.id] = {};
  order.forEach((k,n)=> state.slot[c.id][k] = byHigh[n]);
  state.sel = null;
  syncRolls(c.id);
  resetGear(c);
  render();
}
// 把第 i 組數值移到 dest（屬性代號，或 "tray" 放回籌碼盤）；目標格已有數值就互換
function moveSet(i, dest){
  const c = CRITTERS[state.active];
  const slot = state.slot[c.id];
  const from = ABILITIES.map(a=>a.k).find(k=>slot[k]===i) || null;
  if(dest==="tray"){
    if(from) slot[from] = null;
  } else {
    if(from===dest){ state.sel = null; render(); return; }
    const occupant = slot[dest];
    slot[dest] = i;
    if(from) slot[from] = (occupant===undefined ? null : occupant);
  }
  state.sel = null;
  syncRolls(c.id);
  resetGear(c);
  render();
}
// 籌碼：拖曳（滑鼠與觸控共用 pointer 事件）＋點選
function bindTokens(){
  document.querySelectorAll("[data-chip]").forEach(el=>{
    el.addEventListener("pointerdown", e=>{
      if(e.button!==undefined && e.button!==0) return;
      const i = +el.dataset.chip, sx = e.clientX, sy = e.clientY;
      let ghost = null, over = null;
      const move = ev=>{
        if(!ghost){
          if(Math.hypot(ev.clientX-sx, ev.clientY-sy) < 6) return;
          ghost = el.cloneNode(true); ghost.classList.add("ghost"); ghost.classList.remove("pop","sel");
          document.body.appendChild(ghost); el.classList.add("lifted");
        }
        ghost.style.left = ev.clientX+"px"; ghost.style.top = ev.clientY+"px";
        const t = document.elementFromPoint(ev.clientX, ev.clientY)?.closest("[data-slot],[data-tray]");
        if(over!==t){ over?.classList.remove("over"); t?.classList.add("over"); over = t; }
        ev.preventDefault();
      };
      const up = ev=>{
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
        window.removeEventListener("pointercancel", up);
        if(ghost){
          ghost.remove(); el.classList.remove("lifted"); over?.classList.remove("over");
          const t = document.elementFromPoint(ev.clientX, ev.clientY)?.closest("[data-slot],[data-tray]");
          if(t) moveSet(i, t.dataset.slot || "tray");
        } else {
          // 沒拖動＝點選：再點一次取消
          state.sel = state.sel===i ? null : i; render();
        }
      };
      window.addEventListener("pointermove", move, {passive:false});
      window.addEventListener("pointerup", up);
      window.addEventListener("pointercancel", up);
    });
  });
  // 已選中籌碼時，點格子或籌碼盤放下
  document.querySelectorAll("[data-slot],[data-tray]").forEach(z=>z.addEventListener("click", e=>{
    if(state.sel===null || e.target.closest("[data-chip]")) return;
    moveSet(state.sel, z.dataset.slot || "tray");
  }));
}

function bind(){
  const $ = id => document.getElementById(id);
  $("start")?.addEventListener("click", ()=>{state.page="roll";render()});
  $("back")?.addEventListener("click", ()=>{state.page="cover";render()});
  $("back2")?.addEventListener("click", ()=>{state.page="roll";render()});
  $("next")?.addEventListener("click", ()=>{state.page="story";state.scene="prologue";state.line=0;state.info=null;render();window.scrollTo(0,0)});
  const stage = $("stage");
  const adv = ()=>{ if(state.line < SCENES[state.scene].script.length-1){ state.line++; updateStoryLine(); $("stage")?.focus({preventScroll:true}); } };
  document.querySelector(".fp-page")?.addEventListener("click", e=>{
    if(e.target.closest("button, .info, .nav")) return;
    adv();
  });
  stage?.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); adv(); } });
  document.querySelectorAll("[data-info]").forEach(b=>b.addEventListener("click", ()=>{
    state.info = state.info===b.dataset.info ? null : b.dataset.info; render();
  }));

  $("toShop")?.addEventListener("click", ()=>{
    CRITTERS.forEach(c=>{ if(state.gold[c.id]===undefined){ state.gold[c.id]=100*GP; state.inv[c.id]=[]; } });
    state.page="shop"; render(); window.scrollTo(0,0);
  });
  $("backStory")?.addEventListener("click", ()=>{state.page="story";state.scene="prologue";render()});
  $("depart")?.addEventListener("click", ()=>{state.page="story";state.scene="farewell";state.line=0;state.info=null;render();window.scrollTo(0,0)});
  $("backShop")?.addEventListener("click", ()=>{state.page="shop";render()});
  $("toMap")?.addEventListener("click", ()=>{
    state.page="map"; state.location="tavern"; state.mapSel=null;
    state.travel = {from:"tavern", to:"town", t:0, stop:.5, alert:false};
    render(); window.scrollTo(0,0); startTravel();
  });
  $("toBattle")?.addEventListener("click", ()=>{state.page="battle"; startBattle("ambush"); window.scrollTo(0,0)});
  if(state.page==="battle") bindBattle();
  if(state.page==="doll") bindDollDemo();
  document.querySelectorAll("[data-loc]").forEach(g=>{
    const go = ()=>{ state.mapSel = g.dataset.loc; render(); };
    g.addEventListener("click", go);
    g.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
  });
  document.querySelectorAll("[data-stab]").forEach(b=>b.addEventListener("click", ()=>{state.shopActive=+b.dataset.stab;render()}));
  document.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click", ()=>{state.shopCat=b.dataset.cat;render()}));
  document.querySelectorAll("[data-buy]").forEach(b=>b.addEventListener("click", ()=>{
    const id = CRITTERS[state.shopActive].id, it = ITEMS.find(i=>i.id===b.dataset.buy);
    if(blockReason(id,it)) return;
    state.gold[id] -= it.cost; state.inv[id].push(it.id);
    state.quip = pick(DWARF_QUIPS.buy); render();
  }));
  document.querySelectorAll("[data-sell]").forEach(b=>b.addEventListener("click", ()=>{
    const id = CRITTERS[state.shopActive].id;
    const [x] = state.inv[id].splice(+b.dataset.sell,1);
    state.gold[id] += ITEMS.find(i=>i.id===x).cost;
    state.quip = pick(DWARF_QUIPS.sell); render();
  }));
  // 滑到被擋的按鈕上時，大爺吐槽一句
  document.querySelectorAll(".item.blocked").forEach(el=>el.addEventListener("click", e=>{
    if(e.target.closest("[data-iteminfo]")) return;
    const why = el.querySelector(".it-why").textContent;
    const k = why.includes("力量")||why.includes("敏捷") ? "str" : why.includes("金幣") ? "gold" : why.includes("揹") ? "weight" : "dup";
    state.quip = pick(DWARF_QUIPS[k]); render();
  }));
  $("rollAll")?.addEventListener("click", rollAll);
  $("autoAssign")?.addEventListener("click", autoAssign);
  bindTokens();
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click", ()=>{
    state.active = +b.dataset.tab; state.sel = null; render();
  }));
}

// 測試用：網址後面加 #battle 直接進戰鬥（自動擲屬性、自動分配、給一套預設裝備）
function quickBattle(){
  // 香香是遊俠（隊伍的萬金油），穿中甲（大爺指定，也順便測中甲）；買不起或背不動才退回輕甲
  // 道具、備用武器是測試用（快速戰鬥每隻多給 50 gp 買道具，正式商店還是 100 gp）：
  // 玲玲藥水＋鍊金火、嬌嬌網子＋酸液、香香短劍（測換武器）＋網子＋藥水、默默鍊金火＋酸液
  const kit = {fox:["背包","奧術法杖","輕弩","矢匣","布甲","治療藥水","鍊金火"], tiger:["背包","戰斧","輕弩","矢匣","盾牌","重甲","中甲","網子","酸液瓶"], wolf:["背包","短弓","箭袋","中甲","輕甲","短劍","網子","治療藥水"], raccoon:["背包","短弓","箭袋","輕甲","鍊金火","酸液瓶"]};
  CRITTERS.forEach((c,i)=>{
    state.active = i;
    state.sets[c.id] = ABILITIES.map(()=>roll4()); state.slot[c.id] = {};
    const order = Object.keys(c.bg).sort((a,b)=>c.bg[b]-c.bg[a]); ABILITIES.forEach(a=>{ if(!order.includes(a.k)) order.push(a.k); });
    const hi = state.sets[c.id].map((_,j)=>j).sort((a,b)=>scoreOf(state.sets[c.id][b])-scoreOf(state.sets[c.id][a]));
    order.forEach((k,n)=> state.slot[c.id][k] = hi[n]);
    syncRolls(c.id);
    state.gold[c.id] = 150*GP; state.inv[c.id] = [];
    kit[c.id].forEach(n=>{ const it = ITEMS.find(x=>x.n===n); if(!blockReason(c.id,it)){ state.gold[c.id]-=it.cost; state.inv[c.id].push(it.id); } });
  });
  state.page = "battle"; startBattle("ambush");
}
if(location.hash==="#battle") quickBattle();
else { if(location.hash==="#doll") state.page = "doll"; render(); }

</script>
