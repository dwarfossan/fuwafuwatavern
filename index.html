<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>毛絨絨小隊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@700;900&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap">
<style>
/* 毛絨絨小隊 全站樣式 */
:root{
  color-scheme: dark;
  --night:#1f1a24;      /* 酒館深夜木 */
  --plank:#2d2530;
  --plank-2:#3a2f3b;
  --honey:#f2b441;      /* 蜂蜜燈光 */
  --ale:#e0874a;
  --moss:#8fbf7a;
  --fur:#f6e9d8;        /* 毛絨奶油 */
  --dim:#b9a9b5;
  --ink:#1f1a24;
  --bad:#e0766e;
  --font-body:"LXGW WenKai TC","PingFang TC","Microsoft JhengHei",serif;
  --font-disp:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-num:"Fraunces",Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--night);color:var(--fur);
  font-family:var(--font-body);font-size:16px;line-height:1.7;
  background-image:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(242,180,65,.16), transparent 70%),
    repeating-linear-gradient(90deg, transparent 0 118px, rgba(0,0,0,.18) 118px 120px);
}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:24px 48px}
button{font-family:var(--font-body);cursor:pointer}
button:focus-visible{outline:3px solid var(--honey);outline-offset:3px}

/* ---------- 頁面切換 ---------- */
.page.enter{animation:fade .45s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}

.btn{
  border:2px solid var(--honey);background:var(--honey);color:var(--ink);
  font-weight:700;font-size:17px;padding:10px 22px;border-radius:999px;
  box-shadow:0 4px 0 #a8741f;transition:transform .1s, box-shadow .1s;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8741f}
.btn.ghost{background:transparent;color:var(--honey);box-shadow:none}
.btn.small{font-size:14px;padding:4px 12px;box-shadow:0 2px 0 #a8741f}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- 封面 ---------- */
.cover{display:grid;place-items:center;text-align:center;padding-block:32px 16px;gap:20px}
.sign{
  position:relative;padding:28px 36px 24px;border-radius:18px;
  background:linear-gradient(180deg,#5a4130,#3e2c21);
  border:4px solid #25190f;box-shadow:inset 0 0 0 3px #7a5a40, 0 18px 40px rgba(0,0,0,.5);
  max-width:100%;
}
.sign::before,.sign::after{content:"";position:absolute;top:-46px;width:4px;height:46px;background:#6d5a45}
.sign::before{left:22%}.sign::after{right:22%}
.eyebrow{letter-spacing:.3em;font-size:13px;color:var(--honey);text-transform:uppercase}
.cover h1{
  font-family:var(--font-disp);font-weight:900;margin:4px 0 0;
  font-size:clamp(46px,11vw,96px);line-height:1.05;letter-spacing:.06em;
  color:var(--fur);text-shadow:0 3px 0 #25190f, 0 0 28px rgba(242,180,65,.45);
  text-wrap:balance;
}
.cover .sub{font-size:clamp(15px,3.6vw,19px);color:var(--dim);max-width:34em}
.lanterns{display:flex;gap:28px;justify-content:center}
.lantern{width:18px;height:26px;border-radius:6px;background:var(--honey);box-shadow:0 0 22px 8px rgba(242,180,65,.45);animation:sway 3.4s ease-in-out infinite}
.lantern:nth-child(2){animation-delay:-1.1s}.lantern:nth-child(3){animation-delay:-2.2s}
@keyframes sway{50%{transform:rotate(6deg) translateY(2px)}}
.row-critters{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.row-critters svg{width:84px;height:84px}
.pawnote{font-size:13px;color:var(--dim)}

/* ---------- 擲骰頁 ---------- */
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.head h2{font-family:var(--font-disp);font-size:clamp(26px,6vw,36px);margin:0;line-height:1.2}
.rule{font-size:14px;color:var(--dim);max-width:44em;margin:4px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{
  display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;
  background:var(--plank);border:2px solid var(--plank-2);color:var(--fur);font-size:15px;
}
.tab svg{width:34px;height:34px}
.tab[aria-selected="true"]{border-color:var(--honey);background:var(--plank-2)}
.tab .done{font-size:12px;color:var(--moss)}

.sheet{
  background:var(--plank);border:2px solid var(--plank-2);border-radius:16px;
  padding:18px;display:grid;gap:16px;max-width:44em;width:100%;
}
.sheet-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.sheet-top svg{width:88px;height:88px;flex:none}
.sheet-top h3{margin:0;font-family:var(--font-disp);font-size:26px}
.sheet-top .cls{color:var(--honey);font-size:15px}
.sheet-actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}

.abilities{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ab{
  background:var(--night);border-radius:12px;padding:12px;
  display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:6px 10px;align-items:center;
}
.ab-name{font-weight:700;font-size:17px}
.ab-name small{font-family:var(--font-num);font-weight:700;color:var(--dim);letter-spacing:.12em;font-size:12px;margin-left:6px}
.ab-val{grid-row:span 2;text-align:center;min-width:74px}
.score{font-family:var(--font-num);font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums}
.mod{
  font-family:var(--font-num);font-weight:900;font-size:34px;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--honey);
}
.mod.neg{color:var(--bad)}
.mod.zero{color:var(--fur)}
.dice{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dice .btn{margin-left:6px}
.reroll{justify-self:start}
.bgtag{margin-left:8px;font-size:12px;font-weight:700;color:var(--ink);background:var(--moss);border-radius:999px;padding:0 7px;vertical-align:2px}
.bgnote{font-size:11px;color:var(--moss);font-variant-numeric:tabular-nums}

/* 擲骰頁：籌碼盤、數字籌碼、屬性格子 */
.tray{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
  min-height:84px;padding:12px;border:2px dashed var(--plank-2);border-radius:14px;background:var(--night);transition:border-color .15s}
.tray.over,.slot.over{border-color:var(--honey)}
.tray-empty{margin:0;color:var(--dim);font-size:14px}
.token{
  width:58px;height:58px;border-radius:50%;border:3px solid #a8741f;
  background:radial-gradient(circle at 35% 30%,#ffd98a,var(--honey) 60%,#d9962c);
  color:var(--ink);font-family:var(--font-num);font-weight:900;font-size:26px;line-height:1;
  font-variant-numeric:tabular-nums;box-shadow:0 4px 0 #7a5418;cursor:grab;touch-action:none;user-select:none;
  display:grid;place-items:center;transition:transform .12s, box-shadow .12s;
}
.token:hover{transform:translateY(-2px)}
.token.sel{outline:3px solid var(--fur);outline-offset:3px;transform:translateY(-3px)}
.token.lifted{opacity:.3}
.token.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);cursor:grabbing;box-shadow:0 12px 24px rgba(0,0,0,.5)}
.token.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
.token.pop:nth-child(2){animation-delay:.04s}.token.pop:nth-child(3){animation-delay:.08s}
.token.pop:nth-child(4){animation-delay:.12s}.token.pop:nth-child(5){animation-delay:.16s}.token.pop:nth-child(6){animation-delay:.2s}
@keyframes pop{from{transform:scale(.3);opacity:.2}to{transform:none;opacity:1}}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.slot{background:var(--night);border:2px solid transparent;border-radius:12px;padding:10px 12px;display:grid;gap:6px;transition:border-color .15s}
.slot-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.drop{width:64px;height:64px;border-radius:50%;border:2px dashed var(--plank-2);display:grid;place-items:center;flex:none}
.slot.filled .drop{border-color:transparent}
.drop-hint{font-size:11px;color:var(--dim);text-align:center;line-height:1.2;padding:4px}
.slot .ab-val{text-align:right}

.summary{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px;color:var(--dim)}
.summary b{color:var(--fur);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}

/* ---------- 劇情頁 ---------- */
.story{
  background:linear-gradient(180deg,var(--plank),var(--night));
  border:2px solid var(--plank-2);border-radius:16px;padding:22px;
}
.story p{max-width:36em;margin:0 0 12px;font-size:17px}
.story .narr{color:var(--honey)}
.story .quote{border-left:3px solid var(--ale);padding-left:12px;color:var(--fur)}
.cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:18px}
.card{
  background:var(--plank);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start;
  border-top:6px solid var(--c);
}
.card svg{width:74px;height:74px}
.card h4{margin:0;font-family:var(--font-disp);font-size:22px;line-height:1.3}
.card .cls{color:var(--c);font-size:14px;font-weight:700}
.card p{margin:0;font-size:15px;color:var(--dim)}
.card .tags{display:flex;gap:6px;flex-wrap:wrap}
.card .tags span{font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid var(--c);color:var(--c)}
.card .trait{font-size:14px;color:var(--fur)}
.minis{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center;margin-top:4px}
.minis div{background:var(--night);border-radius:6px;padding:3px 0;font-size:11px;color:var(--dim);line-height:1.3}
.minis b{display:block;font-family:var(--font-num);font-size:15px;color:var(--fur);font-variant-numeric:tabular-nums}
.minis b.hi{color:var(--honey)}.minis b.lo{color:var(--bad)}


/* ---------- 第一人稱序章 ---------- */
.stage{
  position:relative;overflow:hidden;border-radius:16px;cursor:pointer;
  aspect-ratio:16/11;max-height:68vh;width:100%;
  border:3px solid #120e14;background:#2a1f1a;
}
.stage:focus-visible{outline:3px solid var(--honey);outline-offset:3px}
.wall{position:absolute;inset:0;
  background:
    radial-gradient(ellipse 45% 55% at 50% 30%, rgba(242,180,65,.28), transparent 70%),
    repeating-linear-gradient(90deg,#3b2a20 0 70px,#33241b 70px 72px,#3f2d22 72px 142px,#2c1f18 142px 144px);}
.lamp{position:absolute;top:0;left:50%;width:4px;height:9%;background:#1a1210;transform:translateX(-50%)}
.lamp::after{content:"";position:absolute;left:50%;top:100%;width:34px;height:26px;transform:translateX(-50%);
  border-radius:8px 8px 14px 14px;background:var(--honey);box-shadow:0 0 50px 20px rgba(242,180,65,.4)}
.dwarf{position:absolute;left:50%;bottom:22%;height:74%;aspect-ratio:490/560;transform:translateX(-50%);transform-origin:50% 100%}
.dwarf svg{width:100%;height:100%;display:block}
.dwarf.talk{animation:grumble .5s ease}
@keyframes grumble{30%{transform:translateX(-50%) scale(1.03,.97)}60%{transform:translateX(-50%) scale(.99,1.02)}}
.counter{position:absolute;left:0;right:0;bottom:0;height:30%;
  background:linear-gradient(180deg,#7a5236 0 12%,#5a3a26 12% 16%,#4a2f1f 16%);
  box-shadow:0 -6px 18px rgba(0,0,0,.45)}
.dialog{
  position:absolute;left:3%;right:3%;bottom:4%;min-height:22%;
  background:rgba(24,19,28,.94);border:2px solid var(--plank-2);border-radius:12px;
  padding:14px 18px 22px;display:grid;align-content:start;gap:4px;
}
.dialog p{margin:0;font-size:clamp(15px,2.6vw,19px);line-height:1.6;max-width:none}
.dialog.narr p{color:var(--dim);font-style:italic}
.speaker{position:absolute;top:-16px;left:16px;background:var(--c);color:var(--ink);
  font-weight:700;padding:1px 14px;border-radius:999px;font-size:15px}
.hint{position:absolute;right:14px;bottom:6px;font-size:12px;color:var(--honey);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}

.party{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pf{
  background:var(--plank);border:2px solid var(--plank-2);border-radius:12px;color:var(--fur);
  display:grid;justify-items:center;gap:2px;padding:8px 4px;transition:transform .2s,border-color .2s;
}
.pf svg{width:min(64px,16vw);height:min(64px,16vw)}
.pf-name{font-weight:700;font-size:15px}
.pf-mods{display:grid;grid-template-columns:repeat(3,auto);gap:0 6px;font-size:11px;color:var(--dim);
  font-variant-numeric:tabular-nums}
.pf-mods .hi{color:var(--honey)}.pf-mods .lo{color:var(--bad)}
.pf.speaking{border-color:var(--c);transform:translateY(-6px);box-shadow:0 6px 0 var(--c)}
.pf.open{background:var(--plank-2)}
.info{margin-top:10px;background:var(--plank);border-radius:12px;padding:14px;border-left:5px solid var(--c)}
.info-top{display:flex;gap:12px;align-items:center}
.info-top svg{width:56px;height:56px}
.info h4{margin:0;font-family:var(--font-disp);font-size:20px}
.info .cls{color:var(--c);font-size:13px}
.info .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.info .tags span{font-size:12px;padding:0 8px;border-radius:999px;border:1px solid var(--c);color:var(--c)}
.info p{margin:8px 0 0;font-size:15px;color:var(--dim);max-width:40em}
/* 送別：抱抱（第一人稱：鏡頭貼近大爺、四周暖光，下方頭像一起跳一下） */
.stage.hugging .dwarf{transform:translateX(-50%) translateY(24%) scale(1.4);transition:transform .7s cubic-bezier(.3,1.2,.5,1)}
.hug-glow{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse 70% 60% at 50% 45%,transparent 45%,rgba(242,180,65,.35) 100%);animation:glow .8s ease both}
@keyframes glow{from{opacity:0}to{opacity:1}}
.party.cheer .pf{animation:cheer .6s ease both}
.party.cheer .pf:nth-child(2){animation-delay:.08s}.party.cheer .pf:nth-child(3){animation-delay:.16s}.party.cheer .pf:nth-child(4){animation-delay:.24s}
@keyframes cheer{40%{transform:translateY(-12px)}70%{transform:translateY(2px)}100%{transform:none}}

/* 第一人稱場景背景 */
.scene-bg{position:absolute;inset:0}
.scene-bg .story-bush{transform-box:fill-box;transform-origin:50% 100%}
.scene-bg.bush-shake .story-bush{animation:bush-shake .9s ease-in-out infinite}
@keyframes bush-shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-3deg) scaleY(.98)}30%{transform:rotate(2.5deg)}45%{transform:rotate(-1.5deg)}60%{transform:rotate(0)}}
.scene-bg > svg{width:100%;height:100%;display:block}

/* 大地圖 */
.map-frame{border-radius:16px;overflow:hidden;border:6px solid #4a2f1f;box-shadow:inset 0 0 0 2px #7a5236, 0 10px 30px rgba(0,0,0,.4);background:#5f8744}
.worldmap{display:block;width:100%;height:auto}
.worldmap .loc{cursor:pointer;outline:none}
.worldmap .loc:hover rect,.worldmap .loc:focus-visible rect{stroke:#f2b441}
.map-info{margin-top:12px;background:var(--plank);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.map-info h3{margin:0;font-family:var(--font-disp);font-size:22px}
.map-info p{margin:4px 0 0;color:var(--dim)}
.worldmap .alert{animation:alertpop .45s cubic-bezier(.3,1.8,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes alertpop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}

/* 戰鬥 */
.battle .order{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ord{border-radius:50%;border:3px solid var(--c);background:var(--night);line-height:0;transition:transform .2s}
.ord.now{transform:translateY(-4px) scale(1.12);box-shadow:0 0 0 3px var(--honey)}
.ord.out{opacity:.3;filter:grayscale(1)}
.tut{background:#2f3a26;border:1px solid var(--moss);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tut b{color:var(--moss)}
.tut-x{margin-left:auto;background:none;border:1px solid var(--moss);color:var(--moss);border-radius:999px;padding:1px 10px;font-size:13px}
.board-wrap{position:relative;height:min(600px,70vh);background:radial-gradient(ellipse at 50% 40%,#3a4a2c,#1f1a24 75%);border-radius:14px;overflow:hidden;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
@media (max-width:560px){.board-wrap{height:min(520px,62vh)}}
.board{position:absolute;left:0;top:0;display:block;max-width:none;user-select:none;-webkit-user-drag:none;will-change:transform}
.board-dragging .board-wrap{cursor:grabbing}
.board-dragging .board .tile:hover{filter:none}
.board .tile{cursor:pointer}
.board .tile.mv{fill:#7fb4e8;fill-opacity:.85}
.board .tile.tg{fill:#e0766e;fill-opacity:.9}
.board .tile.ar{fill:#e0766e;fill-opacity:.35}
.board .range-line{pointer-events:none}
.board .hid-ol{cursor:pointer}
.board .token.hid-me > svg, .board .token.hid-me > ellipse{opacity:.5}
.board .hid-eye{pointer-events:none}
/* 戰鬥台詞氣泡框 */
.board .bark{pointer-events:none;animation:bark var(--dur,1800ms) ease-out both}
@keyframes bark{0%{opacity:0}6%{opacity:1}88%{opacity:1}100%{opacity:0}}
.board .bark-t{font:700 16px var(--font-body);fill:#1f1a24}
.board .bark-s{font:700 11px var(--font-body);fill:#8a6a3a}
/* 被動觀察的頭上符號（2026-10-01 大爺）：白色泡泡框；! 紅色突然彈出（靈光一閃）、? 藍色以底部為中心左右搖擺（摸不著）、... 黑色一點一點出來（無言）
   原點（0,0）＝泡泡框尾巴尖端，所以 transform-origin 0 0 就是以底部為中心 */
.board .obs{pointer-events:none}
.board .obs-life{animation:obs-life var(--dur) linear both}
@keyframes obs-life{0%{opacity:0}1%{opacity:1}85%{opacity:1}100%{opacity:0}}
.board .obs-anim{transform-origin:0 0}
.board .obs-ok .obs-anim{animation:obs-pop 520ms cubic-bezier(.2,1.6,.4,1) both}
@keyframes obs-pop{0%{transform:scale(0)}45%{transform:scale(1.32)}70%{transform:scale(.92)}100%{transform:scale(1)}}
.board .obs-fail .obs-anim{animation:obs-sway var(--dur) ease-in-out both}
@keyframes obs-sway{0%{transform:scale(.6) rotate(0);opacity:0}12%{transform:scale(1) rotate(0);opacity:1}26%{transform:rotate(-10deg)}42%{transform:rotate(9deg)}58%{transform:rotate(-7deg)}74%{transform:rotate(5deg)}88%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
.board .obs-known .obs-anim{animation:obs-fade 500ms ease-out both}
@keyframes obs-fade{from{opacity:0}to{opacity:1}}
.board .obs-dot{animation:obs-fade 260ms ease-out both}
.board .obs-glyph{font:900 30px/1 var(--font-num,var(--font-body))}
.board .st-badges{pointer-events:none}
.board .st-n{font:800 10px var(--font-num,var(--font-body));fill:#1f1a24}
/* ---------- 骰子面板：貼在戰場上緣外側往上長（蓋住回合順序、狀態列，不擋戰場演出）---------- */
.dp-anchor{position:relative;height:0;z-index:6}
.dice-panel{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);z-index:2;cursor:pointer;
  min-width:220px;max-width:min(470px,94%);padding:6px 12px 8px;border-radius:12px;background:rgba(31,26,36,.88);
  border:1px solid rgba(246,233,216,.18);box-shadow:0 6px 18px rgba(0,0,0,.45);color:var(--fur);background:#221c28}
.dp-head{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim);margin-bottom:2px}
.dp-head>span:first-child{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-x{font-size:12px;color:var(--dim);padding:0 2px}
.dice-panel:hover .dp-x{color:var(--honey)}
.dp-row{display:flex;align-items:center;gap:10px;min-height:48px}
.dp-row + .dp-row{border-top:1px solid rgba(246,233,216,.08)}
.dp-tg{font-size:12px;color:var(--fur);width:5.6em;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-atk,.dp-dmg{display:flex;align-items:center;gap:3px}
.dp-dmg{margin-left:auto;padding-left:10px;border-left:1px solid rgba(246,233,216,.12)}
.dp-die{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.dp-die small{font-size:9px;color:var(--dim);margin-top:1px}
.dp-body{fill:var(--tint);stroke:#1f1a24;stroke-width:2.2;stroke-linejoin:round}
.dp-edge{fill:none;stroke:#1f1a24;stroke-width:1;opacity:.18}
.dp-die.nat20 .dp-body{fill:#ffd36a;filter:drop-shadow(0 0 4px #ffd36a)}
.dp-die.nat1 .dp-body{fill:#e0766e}
.dp-spin{transform-box:fill-box;transform-origin:50% 50%;animation:dp-spin 550ms cubic-bezier(.2,.7,.3,1) both}
@keyframes dp-spin{0%{transform:rotate(-300deg) scale(.55)}70%{transform:rotate(14deg) scale(1.08)}100%{transform:none}}
.dp-f,.dp-n{font:900 12.5px var(--font-num,var(--font-body));fill:#1f1a24}
.dp-f{opacity:0;animation:dp-f 183ms linear both}
@keyframes dp-f{0%,100%{opacity:0}10%,90%{opacity:1}}
.dp-n{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:dp-pop .18s ease-out both}
@keyframes dp-pop{0%{opacity:0;transform:scale(1.6)}100%{opacity:1;transform:none}}
.dp-die.dp-drop{animation:dp-drop .3s ease-out both;animation-delay:var(--land)}
@keyframes dp-drop{to{opacity:.3;transform:scale(.82)}}
.dp-mod{font:800 15px var(--font-num,var(--font-body));color:var(--fur);opacity:0;animation:dp-pop .18s ease-out both;animation-delay:var(--land);margin:0 2px}
.dp-total{display:inline-flex;flex-direction:column;align-items:center;min-width:3.2em;margin-left:4px;opacity:0;animation:dp-pop .22s ease-out both;animation-delay:var(--land)}
.dp-total b{font:900 26px/1 var(--font-num,var(--font-body));-webkit-text-stroke:3px #1f1a24;paint-order:stroke}
.dp-total small{font-size:10px;font-weight:800;letter-spacing:.06em;margin-top:2px}
.res-hit{color:#9be08a}.res-miss{color:#b9a9b5}.res-crit{color:#ffd36a}.res-fumble{color:#ff8a7a}.res-save{color:#8fd0f0}.res-fail{color:#ff8a7a}
.res-crit b{text-shadow:0 0 12px rgba(255,211,106,.8)}
.dp-more{font-size:11px;color:var(--dim);text-align:right;margin-top:2px}
@media (max-width:560px){ .dice-panel{left:0;right:0;transform:none;max-width:none;min-width:0;padding:5px 8px 6px}
  .dp-row{gap:5px;min-height:42px}
  .dp-tg{width:3.4em;font-size:11px}
  .dp-die svg{width:26px;height:26px}
  .dp-atk,.dp-dmg{gap:1px}
  .dp-dmg{padding-left:5px}
  .dp-total{min-width:2.4em;margin-left:2px}
  .dp-total b{font-size:21px;-webkit-text-stroke:2.5px #1f1a24}
  .dp-total small{font-size:9px;letter-spacing:0}
  .dp-mod{font-size:13px;margin:0 1px} }
/* 燃燒：身上的火焰上下閃動 */
.board .fx-burn{pointer-events:none}
.board .burn-f{transform-box:fill-box;transform-origin:50% 100%;animation:burn-f .55s ease-in-out infinite alternate}
@keyframes burn-f{0%{transform:scale(1,1) translateY(0);opacity:.95}50%{transform:scale(.88,1.12) translateY(-1px)}100%{transform:scale(1.08,.9) translateY(1px);opacity:.8}}
.lg-talk{color:#ffd98a}
.ls-ev.lg-talk .ls-h{color:#ffd98a}
.board .cov-tag{pointer-events:none}
.board .cov-tag text{fill:#ffd9d2;font-size:18px;font-weight:700;font-family:var(--font-body)}
.board .tile:hover{filter:brightness(1.15)}
.board .token{cursor:pointer}

.board .token.down > ellipse{opacity:.4}
.board .gob{transform-box:fill-box;transform-origin:50% 100%}
.board .gob.act-lunge{animation:gob-lunge .46s ease-out both;animation-delay:var(--d)}
.board .gob.act-hurt{animation:gob-hurt .45s ease-out both;animation-delay:var(--d)}
.board .gob.act-hop{animation:body-hop .16s ease-out both;animation-delay:var(--d)}
@keyframes gob-lunge{40%{transform:translate(var(--lx),var(--ly)) rotate(6deg)}100%{transform:none}}
@keyframes gob-hurt{0%{filter:none}12%{filter:brightness(2.2) saturate(.2)}20%{transform:translateX(-6px) rotate(-5deg)}40%{transform:translateX(5px);filter:brightness(1.3) sepia(1) hue-rotate(-40deg) saturate(4)}100%{transform:none;filter:none}}
.board .dying{animation:gob-die .8s ease-in both}
@keyframes gob-die{0%{opacity:1}40%{opacity:1}100%{opacity:0;transform:translateY(10px)}}
.board .fx > g{animation:fx-pop .6s ease-out both}
@keyframes fx-pop{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.1)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
.board .fx-slash > g{animation-name:fx-slash}
@keyframes fx-slash{0%{opacity:0;transform:rotate(-40deg) scale(.6)}20%{opacity:1;transform:rotate(0) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:rotate(10deg) scale(1.1)}}
.board .fx-pierce > g{animation-name:fx-pierce}
@keyframes fx-pierce{0%{opacity:0;transform:translateX(-24px)}25%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateX(8px)}}
.board .tile-now{fill:#f2b441;fill-opacity:.6;stroke:#fff4b0;stroke-width:4;pointer-events:none;animation:tile-now 1.2s ease-in-out infinite}
@keyframes tile-now{0%,100%{fill-opacity:.45;stroke-opacity:.7}50%{fill-opacity:.9;stroke-opacity:1}}
.board .down-t{font-size:14px;font-weight:700;fill:#f6e9d8}
.board .float{font-family:var(--font-num);font-weight:900;font-size:28px;stroke:#1f1a24;stroke-width:4;paint-order:stroke;animation:floatup 1s ease-out both}
.board .float.miss{fill:#b9a9b5;font-size:20px;font-family:var(--font-body)}
.board .float.dmg{fill:#ff8a7a}.board .float.heal{fill:#9be08a}
@keyframes floatup{0%{transform:translateY(6px);opacity:0}12%{transform:none;opacity:1}70%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.bt-side-panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.bt-card{background:var(--plank);border-radius:14px;padding:14px;display:grid;gap:10px;border-top:5px solid var(--c,var(--bad))}
.bt-card h3{margin:0;font-family:var(--font-disp);font-size:20px}
.dim{color:var(--dim);font-size:14px}
.bt-me{display:flex;gap:10px;align-items:center}
.bt-res{display:flex;justify-content:space-between;font-size:14px;color:var(--dim)}
.bt-res b{color:var(--fur);font-variant-numeric:tabular-nums}
.bt-st{display:flex;gap:4px;flex-wrap:wrap}
.chip-s{font-size:12px;background:var(--night);border-radius:999px;padding:1px 8px;color:var(--honey)}
.skills{display:grid;gap:6px}
.skill{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;text-align:left;background:var(--night);color:var(--fur);
  border:2px solid var(--plank-2);border-radius:10px;padding:7px 10px;font-size:15px}
.skill:hover:not(:disabled){border-color:var(--honey)}
.skill.on{border-color:var(--honey);background:#3a2f22}
.skill:disabled{opacity:.45;cursor:not-allowed}
.sk-ic{color:var(--honey);line-height:0}
.sk-t{font-size:11px;color:var(--dim)}
.sk-desc{margin:0;font-size:13px;color:var(--fur);background:var(--night);border-radius:8px;padding:8px}
.bt-result{background:var(--plank);border-radius:14px;padding:18px;text-align:center;display:grid;gap:8px}
.bt-result h3{margin:0;font-family:var(--font-disp);font-size:28px}
.bt-result.win h3{color:var(--honey)}.bt-result.lose h3{color:var(--bad)}
.bt-result p{margin:0;color:var(--dim)}
.lg{color:var(--dim)}.lg-turn{color:var(--fur);font-weight:700;margin-top:4px}.lg-skill{color:var(--honey)}
.lg-hit{color:#f6e9d8}.lg-miss{color:#8f8494}.lg-dmg{color:#ff8a7a}.lg-heal{color:#9be08a}.lg-kill{color:var(--bad);font-weight:700}

/* 詳情卡 */
.it-name{background:none;border:0;padding:0;color:var(--fur);font-weight:700;font-size:16px;cursor:pointer;text-align:left;font-family:var(--font-body)}
.it-name:hover{color:var(--honey)}
.it-i{font-size:12px;color:var(--dim);margin-left:4px}
.bag .it-name{font-size:14px;font-weight:400}
.skicon{position:relative;display:inline-grid;place-items:center;width:var(--s);height:var(--s);border-radius:8px;background:#2f2632;flex:none}
.skicon i{position:absolute;right:-5px;bottom:-5px;font-style:normal;font-size:10px;font-weight:700;line-height:1;padding:2px 3px;border-radius:5px;color:var(--ink)}
.skicon.t-sig i{background:var(--moss)}.skicon.t-bat i{background:var(--ale)}.skicon.t-auto i{background:#9fb7d8}
.skicon.t-bat{box-shadow:inset 0 0 0 2px var(--ale)}
.skill-row{display:flex;gap:4px}
.skill-row .skill{flex:1}
.sk-info{background:var(--night);border:2px solid var(--plank-2);color:var(--dim);border-radius:10px;width:36px;font-size:16px}
.sk-info:hover{color:var(--honey);border-color:var(--honey)}
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(10,8,12,.62);display:grid;place-items:center;padding:16px;animation:fade .2s ease both}
.modal{position:relative;width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--plank);border:2px solid var(--plank-2);
  border-radius:16px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.md-x{position:absolute;top:10px;right:10px;background:none;border:0;color:var(--dim);font-size:18px;width:32px;height:32px}
.md-x:hover{color:var(--fur)}
.md-head{display:flex;gap:16px;align-items:center;color:var(--honey);padding-right:30px}
.md-head h3{margin:0;font-family:var(--font-disp);font-size:22px;color:var(--fur)}
.md-rows{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:14px 0 0;font-size:14px}
.md-rows dt{color:var(--honey);white-space:nowrap}
.md-rows dd{margin:0;color:var(--fur)}
.md-sub{margin:16px 0 8px;font-size:15px}
.md-sub .dim{font-weight:400;margin-left:6px;font-size:12px}
.md-skills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.md-sk{display:grid;justify-items:center;gap:4px;background:var(--night);border:2px solid var(--plank-2);border-radius:12px;padding:10px 4px;color:var(--fur);font-size:14px}
.md-sk:hover{border-color:var(--honey)}
.md-sk small{color:var(--dim);font-size:11px}
.md-hint{margin:6px 0 0;text-align:center;font-size:12px}
.md-effect{margin:14px 0 0;font-size:16px;line-height:1.7;background:var(--night);border-radius:10px;padding:10px 12px}
.md-cd{margin:8px 0 0;color:var(--bad);font-size:14px}
.modal .btn.small{margin-top:14px}

/* 戰鬥（舊暫停頁，保留樣式） */
.battle-wip{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;background:var(--plank);border-radius:16px;padding:20px}
@media (max-width:640px){.battle-wip{grid-template-columns:1fr}}
.bt-side h3{margin:0 0 10px;font-family:var(--font-disp);font-size:18px;text-align:center}
.bt-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bt-unit{display:grid;justify-items:center;gap:4px;font-size:14px}
.bt-unit svg{width:72px;height:72px;border-radius:50%;background:var(--night);border:3px solid var(--c,var(--bad));padding:4px}
.bt-unit.foe svg{padding:2px}
.bt-vs{font-family:var(--font-num);font-weight:900;font-size:32px;color:var(--honey);text-align:center}
.here{margin-left:10px;font-size:12px;font-family:var(--font-body);background:var(--moss);color:var(--ink);border-radius:999px;padding:1px 9px;vertical-align:3px}
.progress{align-self:center;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
@media (max-width:520px){ .pf-mods{grid-template-columns:repeat(2,auto)} .stage{aspect-ratio:4/5} }


/* ---------- 裝備店 ---------- */
.quip{display:flex;align-items:center;gap:12px;background:var(--plank);border-radius:12px;padding:8px 14px;margin-bottom:12px}
.quip-face{width:56px;height:56px;flex:none;border-radius:50%;overflow:hidden;background:#3b2a20;border:2px solid var(--ale)}
.quip-face svg{width:100%;height:100%;display:block}
.quip p{margin:0;font-size:16px}
.shop{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:start}
@media (max-width:720px){.shop{grid-template-columns:1fr}.shop-side{order:-1}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--plank);color:var(--dim);border:1px solid var(--plank-2);border-radius:999px;padding:3px 12px;font-size:14px}
.chip.on{background:var(--honey);color:var(--ink);border-color:var(--honey);font-weight:700}
.items{display:grid;gap:6px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;
  background:var(--plank);border-radius:10px;padding:10px 12px}
.item b{font-size:16px}.item small{color:var(--dim);font-size:12px}
.it-spec{font-size:13px;color:var(--dim)}
.it-side{display:grid;justify-items:end;font-variant-numeric:tabular-nums}
.it-cost{color:var(--honey);font-weight:700;white-space:nowrap}
.it-wt{font-size:12px;color:var(--dim)}
.item.blocked{opacity:.6;cursor:help}
.it-why{grid-column:1/-1;font-size:12px;color:var(--bad)}
.shop-side{background:var(--plank);border-radius:12px;padding:14px;display:grid;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.side-top{display:flex;gap:10px;align-items:center}
.side-top svg{width:52px;height:52px}
.side-top h3{margin:0;font-family:var(--font-disp);font-size:20px}
.mini-stats{font-size:12px;color:var(--dim)}
.stat-row{display:flex;justify-content:space-between;font-size:14px;color:var(--dim)}
.stat-row b{color:var(--fur);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--night);overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss)}
.bag{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:4px}
.bag li{display:flex;justify-content:space-between;align-items:center;background:var(--night);border-radius:8px;padding:4px 8px;font-size:14px}
.bag li.empty{color:var(--dim);justify-content:center}
.btn.small.ghost{box-shadow:none}


/* ---------- 紙娃娃 ---------- */
.doll .dl-act{transform-box:view-box;transform-origin:70px 140px}
.doll .dl-bob{transform-box:view-box;transform-origin:70px 140px;animation:dlbob 1.6s ease-in-out infinite;animation-delay:var(--b)}
.doll .dl-arm{transform-box:view-box;transform-origin:86px 96px}
.doll .dl-off{transform-box:view-box;transform-origin:44px 98px}
.doll .dl-glow{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.doll .dl-lie{transform-box:view-box;transform-origin:70px 140px}
.doll.dl-down .dl-lie,.doll.dl-prone .dl-lie{transform:rotate(-78deg) translate(-6px,-4px)}
.doll.dl-down .dl-lie{opacity:.55}
.doll.dl-prone .dl-bob{animation:none}
/* 被推倒：從站著倒下去（外層已經躺平，這裡從「轉回站姿」播到 0） */
.act-fall.dl-act{animation:body-fall .45s cubic-bezier(.5,0,.8,.6) both;animation-delay:var(--d)}
@keyframes body-fall{0%{transform:translate(6px,4px) rotate(78deg)}70%{transform:rotate(-6deg)}85%{transform:rotate(3deg)}100%{transform:none}}
/* 爬起來 */
.act-getup.dl-act{animation:body-getup .52s ease-out both;animation-delay:var(--d)}
@keyframes body-getup{0%{transform:rotate(-78deg) translate(-6px,-4px)}55%{transform:rotate(8deg) translateY(-6px)}80%{transform:rotate(-3deg)}100%{transform:none}}
.doll.dl-down .dl-bob{animation:none}
@keyframes dlbob{50%{transform:translateY(-2.5px)}}
.act-slash .dl-arm {animation:arm-slash .55s ease-out both;animation-delay:var(--d)}
@keyframes arm-slash{30%{transform:rotate(-75deg)}50%{transform:rotate(95deg)}75%{transform:rotate(80deg)}100%{transform:none}}
.act-smash .dl-arm {animation:arm-smash .72s ease-in both;animation-delay:var(--d)}
.act-smash.dl-act  {animation:body-smash .72s ease-out both;animation-delay:var(--d)}
@keyframes arm-smash{45%{transform:rotate(-130deg)}60%{transform:rotate(110deg)}82%{transform:rotate(100deg)}100%{transform:none}}
@keyframes body-smash{45%{transform:translateY(-6px) rotate(-4deg)}60%{transform:translateY(2px) rotate(5deg) scale(1.04,.96)}100%{transform:none}}
.act-combo .dl-arm {animation:arm-combo .85s ease-out both;animation-delay:var(--d)}
@keyframes arm-combo{15%{transform:rotate(-70deg)}30%{transform:rotate(90deg)}45%{transform:rotate(-60deg)}62%{transform:rotate(100deg)}82%{transform:rotate(85deg)}100%{transform:none}}
.act-spin.dl-act   {animation:body-spin .76s ease-in-out both;animation-delay:var(--d)}
.act-spin .dl-arm  {animation:arm-spin .76s ease-in-out both;animation-delay:var(--d)}
@keyframes body-spin{25%{transform:scaleX(-1)}50%{transform:scaleX(1)}75%{transform:scaleX(-1)}100%{transform:none}}
@keyframes arm-spin{12%{transform:rotate(75deg)}88%{transform:rotate(75deg)}100%{transform:none}}
.act-thrust .dl-arm{animation:arm-thrust .52s ease-out both;animation-delay:var(--d)}
.act-thrust.dl-act {animation:body-thrust .52s ease-out both;animation-delay:var(--d)}
@keyframes arm-thrust{30%{transform:translate(-8px,2px) rotate(55deg)}55%{transform:translate(24px,-2px) rotate(60deg)}78%{transform:translate(18px,-2px) rotate(60deg)}100%{transform:none}}
@keyframes body-thrust{55%{transform:translateX(8px) rotate(4deg)}100%{transform:none}}
.act-guard .dl-arm {animation:arm-guard .6s ease-out both;animation-delay:var(--d)}
.act-guard .dl-off {animation:off-guard .6s ease-out both;animation-delay:var(--d)}
@keyframes arm-guard{25%{transform:translate(-8px,-4px) rotate(-45deg)}80%{transform:translate(-8px,-4px) rotate(-45deg)}100%{transform:none}}
@keyframes off-guard{25%{transform:translate(8px,-6px)}80%{transform:translate(8px,-6px)}100%{transform:none}}
.act-shoot .dl-arm {animation:arm-shoot .68s ease-out both;animation-delay:var(--d)}
.act-shoot .dl-off {animation:off-shoot .68s ease-out both;animation-delay:var(--d)}
@keyframes arm-shoot{35%{transform:translateX(-4px)}62%{transform:translateX(-4px)}70%{transform:translateX(3px)}100%{transform:none}}
@keyframes off-shoot{30%{transform:translate(58px,-6px)}62%{transform:translate(50px,-6px)}70%{transform:translate(24px,-2px)}100%{transform:none}}
.act-throw .dl-arm {animation:arm-throw .62s ease-in both;animation-delay:var(--d)}
@keyframes arm-throw{45%{transform:translateX(-6px) rotate(-85deg)}62%{transform:translateX(10px) rotate(75deg)}100%{transform:none}}
.act-punch .dl-arm {animation:arm-punch .42s ease-out both;animation-delay:var(--d)}
.act-punch.dl-act  {animation:body-thrust .42s ease-out both;animation-delay:var(--d)}
@keyframes arm-punch{30%{transform:translateX(-6px)}55%{transform:translate(22px,-4px)}78%{transform:translate(18px,-4px)}100%{transform:none}}
.act-cast .dl-arm  {animation:arm-cast .82s ease-out both;animation-delay:var(--d)}
.act-cast .dl-off  {animation:off-cast .82s ease-out both;animation-delay:var(--d)}
.act-cast .dl-glow {animation:glow-cast .82s ease-out both;animation-delay:var(--d)}
@keyframes arm-cast{30%{transform:translateY(-10px) rotate(-12deg)}80%{transform:translateY(-10px) rotate(-12deg)}100%{transform:none}}
@keyframes off-cast{30%{transform:translateY(-16px)}80%{transform:translateY(-16px)}100%{transform:none}}
@keyframes glow-cast{0%{opacity:0;transform:scale(.3)}35%{opacity:.85;transform:scale(1)}55%{opacity:.6;transform:scale(1.4)}80%{opacity:.8;transform:scale(1.1)}100%{opacity:0;transform:scale(1.8)}}
.act-slam.dl-act   {animation:body-slam .76s ease-in-out both;animation-delay:var(--d)}
.act-slam .dl-arm  {animation:arm-smash .76s ease-in both;animation-delay:var(--d)}
@keyframes body-slam{38%{transform:translateY(-18px)}56%{transform:translateY(2px) scale(1.08,.92)}72%{transform:scale(.97,1.03)}100%{transform:none}}

/* ---------- 飛行物、怪物受傷的 X_X 眼睛 ---------- */

@keyframes proj-fly{0%{transform:translate(var(--x0),var(--y0));opacity:0}1%{opacity:1}96%{opacity:1}100%{transform:translate(var(--x1),var(--y1));opacity:0}}

/* ---------- 音效開關 ---------- */
.battle .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sys-tools{display:flex;align-items:flex-start;gap:7px;position:relative;z-index:30}

/* ---------- 戰鬥紀錄：戰場裡的縮小條＋點開的完整紀錄 ---------- */
.bt-logstrip{position:absolute;left:10px;bottom:10px;z-index:1;width:min(480px,72%);display:block;text-align:left;
  background:rgba(31,26,36,.8);border:1px solid rgba(246,233,216,.12);border-radius:10px;padding:6px 10px;color:var(--fur);font-size:13px;line-height:1.45;cursor:pointer}

/* ---------- 爆擊慢動作 ---------- */

@keyframes crit-zoom{from{transform:translate(var(--cx),var(--cy)) scale(1)}to{transform:translate(var(--cx),var(--cy)) scale(1.35)}}

@keyframes crit-vig{0%{opacity:0}20%{opacity:1}100%{opacity:.2}}
.crit-txt{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--font-disp);font-weight:900;font-size:clamp(44px,11vw,84px);
  color:#fff4b0;-webkit-text-stroke:5px #6e3a12;paint-order:stroke;text-shadow:0 6px 0 #3a1f0a,0 0 30px rgba(242,180,65,.9);animation:crit-txt 1s cubic-bezier(.2,1.6,.4,1) both;white-space:nowrap}
@keyframes crit-txt{0%{transform:translateX(-50%) scale(.2) rotate(-12deg);opacity:0}25%{transform:translateX(-50%) scale(1.1) rotate(-4deg);opacity:1}80%{opacity:1}100%{transform:translateX(-50%) scale(1) rotate(-4deg);opacity:0}}

/* ---------- 右下角指令列＋資源燈號＋紀錄（大爺 2026-09-29 定案） ----------
   整塊從戰場底部往上疊：指令列（靠右）→ 資源燈號（紀錄條正上方，「展開」在同一排右邊）→ 紀錄

  width:auto;min-width:0;max-width:none;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.4)}

.bt-dock.dk-act .mn-list{grid-template-columns:1fr 1fr}

.bt-dock .mn-b{min-height:44px;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;line-height:1.3}
.bt-dock .mn-b span{white-space:nowrap}
.bt-dock .mn-b small{font-size:10.5px}
.bt-dock .mn-back{min-height:34px}
.bt-dock.bt-confirm .mn-list{grid-template-columns:1fr 1fr}
.bt-dock.bt-confirm .aim-note{grid-column:1/-1}

.bt-resrow{flex:none;min-height:24px;display:flex;align-items:center}

.25}.status-ability span{display:block;font-size:9px;opacity:.72;margin-top:1px}
.status-loadout{position:relative;min-height:270px;margin-top:2px}.status-paper{min-height:250px}.status-paper .inf-doll>svg{transform:scaleX(-1)}

/* 裝備 → 技能（第一版草案）
   規則：沒有職業，技能全部來自裝備。
   - 武器按「類別」各 4 招：固定普攻（不花點數）＋三個普通招式（花熟練點數）。
     沒有大招這種突然很特別的招式（大爺決定）；說明和實作都不寫死武器名稱，只看武器屬性（投擲、觸及、靈巧……），以後好替換
   - 盾牌 1 招（自動觸發的防禦）；護甲只給被動數值，不給主動技能
   - 法器分法杖／法書／法球，每件綁定一組 3 個法術，以主題命名（施法屬性：法杖智力、法書感知、法球魅力）
   共通數字：命中 = d20 + 屬性調整值 + 2 ≥ 目標 AC；豁免 DC = 8 + 2 + 屬性調整值；
             生命值（1 級）= 8 + 體質調整值；地圖 1 格 = 5 呎
   pts：熟練點數花費（0 = 普攻、戲法，不花點數）。每個角色一個熟練點數池（一級 2 點），
        招式可以多花點數「升環」：up 寫升環效果，沒寫的攻擊招式＝命中時每多花 1 點多 1 顆武器骰；noUp＝不能升環
        單招最多花「等級 + 1」點。multi：每發各自點一個目標（魔法飛彈）
   kind：判定方式。近戰／遠程＝擲攻擊骰對 AC；豁免＝對方擲豁免；輔助＝不打人。一招有兩段的，照第一段擲的骰算
   dmg：傷害種類（大爺定的）。物理＝武器或身體本身的力量；法術＝法術（含神術）不帶元素的；特殊＝其他力量（氣……）；
        元素優先：帶元素的直接寫元素（火焰、強酸……），不管從法術、道具還是龍嘴出來。
        沒寫就照技能組（法器＝法術，其他＝物理）；不造成傷害的寫 dmg:""。
   基本攻擊（第 0 招）的名稱看武器本身：砍的斬擊、戳的刺擊、砸的打擊（含徒手、法杖）、用彈藥的射擊、投擲類的投擲
   free：花免費動作（每回合一次）而不是主動作；D&D 裡原本是附贈動作或反應的招式
   能力 stat："力量"、"敏捷"、"靈巧"（力量或敏捷取高）、"智力"、"感知"
   標 SRD 的法術取自 SRD 5.2（CC-BY-4.0），其餘為本作原創 */

const SPOT_QUIP = {   // 台詞草稿，大爺改完才算數

};
function scoutBattle(id){
  const def = BATTLES[id], foes = {};
  def.foes.forEach((f,i)=>{
    if(!f.hidden) return;
    const hide = Math.max(HIDE_DC, d20() + ENEMIES[f.type].mods.DEX);
    const spotted = CRITTERS.filter(c=>10 + modOf(finalScore(c.id,"WIS")) >= hide).map(c=>c.id);
    foes[i] = {hide, spotted};
  });
  state.scout = {battle:id, foes};
}
const scoutSpotters = () => { const sc = state.scout; if(!sc) return [];
  return [...new Set(Object.values(sc.foes).flatMap(f=>f.spotted))]; };
function ambushScript(){
  const who = scoutSpotters();
  if(!who.length) return AMBUSH;
  const extra = [{who:"narr", text:"路邊的草叢，好像晃了一下。", shake:true},
                 ...CRITTERS.filter(c=>who.includes(c.id)).map(c=>({who:c.id, text:SPOT_QUIP[c.id], shake:true}))];
  return [...AMBUSH.slice(0,-1), ...extra, AMBUSH[AMBUSH.length-1]];
}

/* ======================== 規則：擲骰、調整值 ======================== */
const d6 = () => 1 + Math.floor(Math.random()*6);
const roll4 = () => [d6(),d6(),d6(),d6()];
const dropIdx = arr => arr.indexOf(Math.min(...arr));
const scoreOf = arr => arr.reduce((a,b)=>a+b,0) - Math.min(...arr);
const modOf = s => Math.floor((s-10)/2);
const fmt = m => (m>0?"+":m<0?"−":"±") + Math.abs(m);
// 背景加成與最終屬性值（創角時屬性值上限 20）
const bgOf = (id,k) => CRITTERS.find(c=>c.id===id).bg[k] || 0;
const finalScore = (id,k) => Math.min(20, scoreOf(state.rolls[id][k]) + bgOf(id,k));
const done = id => state.rolls[id] && ABILITIES.every(a => state.rolls[id][a.k]);

const pick = a => a[Math.floor(Math.random()*a.length)];

/* ======================== 規則：裝備（金錢、負重、AC、購買限制） ======================== */
function money(cp){
  const g=Math.floor(cp/100), s=Math.floor(cp%100/10), c=cp%10;
  return [g?`${g} gp`:"", s?`${s} sp`:"", c?`${c} cp`:""].filter(Boolean).join(" ") || "0 gp";
}
const scoreK = (id,k) => finalScore(id,k);
const invItems = id => state.inv[id].map(x=>ITEMS.find(i=>i.id===x));
const weightOf = id => invItems(id).reduce((s,i)=>s+i.wt,0);
const capOf = id => scoreK(id,"STR")*15;   // 負重上限 = 力量值 × 15 磅
function acOf(id){
  const dex = modOf(scoreK(id,"DEX"));
  const inv = invItems(id);
  const armor = inv.find(i=>i.type==="armor");
  let ac = 10 + dex;
  if(armor) ac = armor.ac + (armor.dex==="full" ? dex : armor.dex==="max2" ? Math.min(dex,2) : 0);
  if(inv.some(i=>i.type==="shield")) ac += 2;
  return ac;
}
/* 能不能買：回傳理由字串，null 代表可以買 */
function blockReason(id, it){
  const str = scoreK(id,"STR"), dex = scoreK(id,"DEX");
  if(it.type==="armor" && it.str && str < it.str) return `需要力量 ${it.str}（目前 ${str}）`;
  if(it.type==="weapon" && it.props.includes("重型")){
    const ranged = it.props.some(p=>p.startsWith("彈藥"));
    if(ranged && dex < 13) return `重型遠程武器需要敏捷 13（目前 ${dex}）`;
    if(!ranged && str < 13) return `重型武器需要力量 13（目前 ${str}）`;
  }
  const inv = invItems(id);
  if(it.type==="shield" && inv.some(i=>i.type==="shield")) return "已經有盾牌了";
  if(state.gold[id] < it.cost) return "金幣不夠";
  if(weightOf(id) + it.wt > capOf(id)) return `揹不動（上限 ${capOf(id)} 磅）`;
  return null;
}

function roadCurve(a, b){
  const p = WORLD.locations.find(l=>l.id===a), q = WORLD.locations.find(l=>l.id===b);
  const mx=(p.x+q.x)/2, my=(p.y+q.y)/2, dx=q.x-p.x, dy=q.y-p.y, len=Math.hypot(dx,dy);
  const bend = len*.18;
  return {p, q, cx: mx - dy/len*bend, cy: my + dx/len*bend};
}
// 路上 t（0~1）位置的座標
// 曲線一律照 WORLD.links 裡那條路的方向算（跟畫出來的路同一條）；反方向走就從終點那頭倒著算
function roadPoint(a, b, t){
  if(WORLD.links.some(l=>l.a===b && l.b===a)){ [a,b] = [b,a]; t = 1-t; }
  const {p,q,cx,cy} = roadCurve(a,b), u = 1-t;
  return {x: u*u*p.x + 2*u*t*cx + t*t*q.x, y: u*u*p.y + 2*u*t*cy + t*t*q.y};
}
// 隊伍棋子（四張臉），以 (0,0) 為中心，外面用 transform 移動
function partyMarkerSVG(alert){
  return CRITTERS.map((c,i)=>{
    const a = -Math.PI/2 + i*Math.PI/2 + Math.PI/4, x = Math.cos(a)*30 - 22, y = -70 + Math.sin(a)*18 - 22;
    return `<circle cx="${x+22}" cy="${y+24}" r="21" fill="#1f1a24" stroke="${c.color}" stroke-width="3"/>`
      + critterSVG(c.id).replace('<svg viewBox="0 0 100 100"', `<svg x="${x}" y="${y}" width="44" height="44" viewBox="0 0 100 100"`);
  }).join("") + (alert ? `<g class="alert"><path d="M-24 -150 h48 a10 10 0 0 1 10 10 v36 a10 10 0 0 1 -10 10 h-14 l-10 12 l-10 -12 h-14 a10 10 0 0 1 -10 -10 v-36 a10 10 0 0 1 10 -10 z" fill="#f2b441" stroke="#2a2630" stroke-width="3"/>
      <text x="0" y="-112" text-anchor="middle" font-size="36" font-weight="900" fill="#2a2630" font-family="Fraunces, Georgia, serif">!</text></g>` : "");
}
function worldMapSVG(sel, here, pos, alert){
  const {width:W, height:H, locations:L, links} = WORLD;
  // 固定種子的亂數：每次畫出來都一樣
  let seed = 20260928;
  const rnd = () => (seed = (seed*1664525 + 1013904223) % 4294967296) / 4294967296;
  const R = (a,b) => a + rnd()*(b-a);
  const loc = id => L.find(l=>l.id===id);
  const INK = "#2a2630";
  const out = [];

  // 草地底色 + 零星草叢與小花
  out.push(`<defs><radialGradient id="meadow" cx="50%" cy="55%" r="75%">
    <stop offset="0" stop-color="#9cbf6e"/><stop offset=".7" stop-color="#83a95a"/><stop offset="1" stop-color="#5f8744"/></radialGradient></defs>`);
  out.push(`<rect width="${W}" height="${H}" fill="url(#meadow)"/>`);
  for(let i=0;i<140;i++){
    const x=R(0,W), y=R(0,H);
    if(rnd()<.8) out.push(`<path d="M${x-4} ${y} q2 -7 4 0 q2 -9 4 0" stroke="#5f8744" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".7"/>`);
    else out.push(`<circle cx="${x}" cy="${y}" r="2.2" fill="${["#f6e9d8","#f2b441","#e6b8c8"][Math.floor(rnd()*3)]}"/>`);
  }

  // 道路：兩地之間的弧線
  links.forEach(({a,b,style})=>{
    const {p,q,cx,cy} = roadCurve(a,b);
    const d = `M${p.x} ${p.y} Q${cx} ${cy} ${q.x} ${q.y}`;
    if(style==="road"){
      out.push(`<path d="${d}" stroke="#8a6a44" stroke-width="20" fill="none" stroke-linecap="round"/>`);
      out.push(`<path d="${d}" stroke="#d9c08e" stroke-width="13" fill="none" stroke-linecap="round"/>`);
    } else {
      out.push(`<path d="${d}" stroke="#d9c08e" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="2 12"/>`);
    }
  });

  // 會互相遮擋的物件（樹、房子、山）收集起來，依 y 由上往下畫
  const props = [];
  const tree = (x,y,s)=>props.push({y, svg:
    `<rect x="${x-3*s}" y="${y-8*s}" width="${6*s}" height="${10*s}" fill="#6e4a32"/>
     <circle cx="${x}" cy="${y-18*s}" r="${14*s}" fill="${rnd()<.5?"#3f6b3a":"#4f7d42"}" stroke="${INK}" stroke-width="2.5"/>
     <circle cx="${x-4*s}" cy="${y-22*s}" r="${5*s}" fill="#6f9960" opacity=".7"/>`});
  const house = (x,y,s,roof,glow)=>props.push({y, svg:
    `<rect x="${x-14*s}" y="${y-18*s}" width="${28*s}" height="${18*s}" fill="#f1e2c6" stroke="${INK}" stroke-width="2.5"/>
     <path d="M${x-18*s} ${y-16*s} L${x} ${y-32*s} L${x+18*s} ${y-16*s} Z" fill="${roof}" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>
     <rect x="${x-4*s}" y="${y-10*s}" width="${8*s}" height="${10*s}" fill="#6e4a32"/>
     ${glow?`<rect x="${x+6*s}" y="${y-14*s}" width="${6*s}" height="${5*s}" fill="#f2b441"/><circle cx="${x+9*s}" cy="${y-11.5*s}" r="${10*s}" fill="#f2b441" opacity=".25"/>`:""}`});
  // 丘陵：圓頂土丘，帶草色和陰影
  const hill = (x,y,w,h,tone)=>props.push({y, svg:
    `<path d="M${x-w} ${y} Q${x-w*.9} ${y-h} ${x} ${y-h} Q${x+w*.9} ${y-h} ${x+w} ${y} Z" fill="${tone}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
     <path d="M${x+w*.15} ${y-h*.98} Q${x+w*.85} ${y-h*.85} ${x+w} ${y} L${x+w*.35} ${y} Q${x+w*.45} ${y-h*.6} ${x+w*.15} ${y-h*.98} Z" fill="#000" opacity=".12"/>
     <path d="M${x-w*.55} ${y-h*.7} q${w*.2} ${-h*.18} ${w*.45} ${-h*.22}" stroke="#b8d08a" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>`});
  const rock = (x,y,s)=>props.push({y, svg:
    `<path d="M${x-10*s} ${y} L${x-7*s} ${y-9*s} L${x+2*s} ${y-12*s} L${x+10*s} ${y-5*s} L${x+9*s} ${y} Z" fill="#9a96a4" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>`});
  L.forEach(l=>{
    if(l.kind==="forest"){
      // 範圍跟城鎮差不多（約 ±95 × ±70）
      for(let i=0;i<30;i++){
        const a=R(0,Math.PI*2), r=Math.sqrt(rnd());
        const x=l.x+Math.cos(a)*r*95, y=l.y+Math.sin(a)*r*70;
        if(Math.hypot(x-l.x,(y-l.y)*1.5)<38) continue; // 中間留一塊空地放名牌
        tree(x,y,R(.8,1.25));
      }
    }
    if(l.kind==="cave"){
      // 範圍跟城鎮差不多：後排兩座小丘 → 洞口大丘 → 前排兩座小丘
      [[-62,-34,48,40,"#7a9a52"],[62,-38,52,42,"#7a9a52"]].forEach(([dx,dy,w,h,t])=>hill(l.x+dx,l.y+dy,w,h,t));
      hill(l.x, l.y+12, 72, 66, "#8fae62");
      props.push({y:l.y+13, svg:`<path d="M${l.x-22} ${l.y+12} Q${l.x-22} ${l.y-24} ${l.x} ${l.y-26} Q${l.x+22} ${l.y-24} ${l.x+22} ${l.y+12} Z" fill="#1f1a24" stroke="${INK}" stroke-width="3"/>
        <path d="M${l.x-26} ${l.y-4} L${l.x-19} ${l.y-22} M${l.x+26} ${l.y-4} L${l.x+19} ${l.y-22}" stroke="#9a96a4" stroke-width="4" stroke-linecap="round"/>`});
      [[-82,26,44,30,"#86a65c"],[84,24,42,28,"#86a65c"]].forEach(([dx,dy,w,h,t])=>hill(l.x+dx,l.y+dy,w,h,t));
      [[-42,20,.9],[44,18,1]].forEach(([dx,dy,s])=>rock(l.x+dx,l.y+dy,s));
    }
    if(l.kind==="town"){
      const roofs=["#b5553f","#40669a","#8b5a34","#6f9960","#b5553f","#40669a"];
      [[-70,-40],[-20,-60],[35,-45],[80,-20],[-85,10],[-35,-5],[25,5],[70,35],[-55,50],[0,55],[45,70]].forEach(([dx,dy],i)=>
        house(l.x+dx+R(-6,6), l.y+dy+R(-4,4), R(.9,1.2), roofs[i%roofs.length], rnd()<.35));
      // 鐘樓
      props.push({y:l.y-10, svg:`<rect x="${l.x-10}" y="${l.y-62}" width="20" height="52" fill="#d8cdb8" stroke="${INK}" stroke-width="2.5"/>
        <path d="M${l.x-14} ${l.y-60} L${l.x} ${l.y-84} L${l.x+14} ${l.y-60} Z" fill="#b5553f" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="${l.x}" cy="${l.y-46}" r="5" fill="#f2b441" stroke="${INK}" stroke-width="2"/>`});
    }
    if(l.kind==="tavern"){
      house(l.x, l.y+6, 1.9, "#8b5a34", true);
      props.push({y:l.y+7, svg:`<path d="M${l.x+30} ${l.y-18} L${l.x+44} ${l.y-18}" stroke="${INK}" stroke-width="3"/>
        <rect x="${l.x+36}" y="${l.y-17}" width="16" height="12" rx="2" fill="#f2b441" stroke="${INK}" stroke-width="2"/>`});
      [[-60,-10],[-48,20],[62,-30],[70,10]].forEach(([dx,dy])=>tree(l.x+dx,l.y+dy,.9));
    }
  });
  props.sort((a,b)=>a.y-b.y).forEach(p=>out.push(p.svg));

  // 名牌與點擊範圍
  L.forEach(l=>{
    const w = l.name.length*18+24, isSel = sel===l.id;
    out.push(`<g class="loc ${isSel?"sel":""}" data-loc="${l.id}" tabindex="0" role="button" aria-label="${l.name}">
      <circle cx="${l.x}" cy="${l.y-10}" r="62" fill="transparent"/>
      ${isSel?`<ellipse cx="${l.x}" cy="${l.y+8}" rx="70" ry="26" fill="none" stroke="#f2b441" stroke-width="4" stroke-dasharray="10 8"/>`:""}
      <rect x="${l.x-w/2}" y="${l.y+18}" width="${w}" height="30" rx="15" fill="#1f1a24" stroke="${isSel?"#f2b441":"#f6e9d8"}" stroke-width="2.5"/>
      <text x="${l.x}" y="${l.y+39}" text-anchor="middle" font-size="18" font-weight="700" fill="#f6e9d8" font-family="LXGW WenKai TC, PingFang TC, Microsoft JhengHei, serif">${l.name}</text>
    </g>`);
  });

  // 隊伍棋子：在地點上，或旅行中在路上（pos）
  const at = pos || loc(here);
  if(at) out.push(`<g id="party-marker" pointer-events="none" transform="translate(${at.x} ${at.y})">${partyMarkerSVG(alert)}</g>`);
  return `<svg class="worldmap" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${out.join("")}</svg>`;
}

      + `<ellipse cx="36" cy="66" rx="5" ry="12" fill="#e0766e" stroke="${INK}" stroke-width="3" transform="rotate(12 36 66)"/>`
      + `<ellipse cx="84" cy="64" rx="5" ry="12" fill="#5fa8a0" stroke="${INK}" stroke-width="3" transform="rotate(-12 84 64)"/>`
      + `<ellipse cx="60" cy="48" rx="4.5" ry="10" fill="#f2b441" stroke="${INK}" stroke-width="3"/>`, -30)
  };
  return {ART, RAW};
})();

/* ======================== 紙娃娃：簡單身體＋浮空的手＋掛上裝備 ========================
   手沒有手臂，是浮在身體旁的圓球（不用處理關節透視）。
   主手拿武器（或法杖），副手拿盾／法書／法球；雙手武器兩隻手都握在武器上。
   動作用 CSS 即時演出：整隻（.dl-act）、主手（.dl-arm）、副手（.dl-off）各自動。
   畫布 140×150，腳底在 (70,140) */

// 裝備怎麼拿：握把位置 (gx,gy)、平常的角度、縮放、雙手時第二隻手的位置
const HELD = {
  sword:        {gy:106, ang:35},
  heavy:        {gy:96,  ang:25, two:122},
  axe:          {gy:112, ang:30},
  mace:         {gy:122, ang:30},
  polearm:      {gy:96,  ang:12, two:128},
  dagger:       {gy:99,  ang:40},
  bow:          {gx:95,  gy:60, ang:-6, s:.56, hx:130, hy:100},   // 弓要拿在身體外側，弦才不會壓在身上
  crossbow:     {gy:112, ang:75},
  thrown:       {gy:72,  ang:25},
  arcane_staff: {gy:100, ang:12},
  shaman_totem: {gy:100, ang:12},
  shield:       {gy:60,  ang:0,  s:.34},
  healing_book: {gx:62,  gy:62, ang:-10, s:.4},
  flame_orb:    {gy:70,  ang:0,  s:.4}
};
const GLOW = {arcane_staff:"#8fd0f0", healing_book:"#9be08a", flame_orb:"#f2b441", shaman_totem:"#c58af0"};

// 每個動作的長度（毫秒）與「打中」的時間點
const DOLL_DUR    = {slash:550, smash:720, combo:850, spin:760, thrust:520, guard:600, shoot:680, throw:620, punch:420, cast:820, slam:760, hurt:600, getup:520, fall:450, hop:160, lunge:460};
const DOLL_IMPACT = {slash:230, smash:400, combo:180, spin:260, thrust:280, guard:0,   shoot:450, throw:380, punch:230, cast:320, slam:420, lunge:200};

// 技能 → 動作（武器：普攻＋三招；法器：法術，法杖第一招是打擊）
const SKILL_ANIM = {
  sword:["slash","guard","combo","thrust"], heavy:["smash","spin","smash","thrust"], axe:["slash","smash","slash","smash"],
  mace:["smash","smash","slam","smash"], polearm:["thrust","guard","spin","thrust"], dagger:["thrust","thrust","thrust","thrust"],
  bow:["shoot","shoot","shoot","shoot"], crossbow:["shoot","shoot","shoot","shoot"], thrown:["throw","throw","throw","throw"],
  unarmed:["punch","slam","punch","combo"], arcane_staff:["smash","cast","cast","cast"], healing_book:["cast","cast","cast"], flame_orb:["cast","cast","cast"],
  shaman_totem:["cast","cast","cast"]
};
const animFor = (groupId, idx) => (SKILL_ANIM[groupId]||[])[idx] || "slash";

// 各角色的尾巴（畫在身體後面）

  if(id==="fox") return pp("M54 120 Q22 116 20 84 Q32 98 46 98 Q40 88 44 76 Q58 96 60 112 Z", c) + pp("M20 84 Q24 76 32 78 Q30 90 38 96 Q26 96 20 84 Z", "#fbead6", 2.5);
  if(id==="tiger") return `<path d="M54 124 Q28 126 28 104 Q28 92 38 88" fill="none" stroke="${INK}" stroke-width="11" stroke-linecap="round"/>
    <path d="M54 124 Q28 126 28 104 Q28 92 38 88" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round"/>

  // 狸貓：短而蓬的尾巴，尾端深咖啡（沒有浣熊的環紋）

// 護甲（紙娃娃的衣服層，蓋在身體上）
function armorSVG(kind){

// 拿在手上的裝備：放在 (hx,hy)，握把對準手
function heldSVG(key, hx, hy, angExtra=0){
  const h = HELD[key]; if(!h) return "";
  const gx = h.gx ?? 60, s = h.s ?? .4;
  return `<g transform="translate(${hx} ${hy}) rotate(${h.ang+angExtra})"><g transform="scale(${s}) translate(${-gx} ${-h.gy})">${ITEM_RAW[key]}</g></g>`;
}
const handSVG = (x,y,c,r=8.5) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="#2a2630" stroke-width="3"/><circle cx="${x-2.5}" cy="${y-2.5}" r="${r*.3}" fill="#fff" opacity=".35"/>`;

// 四隻的外觀
function critterLook(id, c){
  const limb = id==="raccoon" ? "#5a3e2e" : c;   // 狸貓的手腳是深咖啡色
  return {head: critterSide(id), headHurt: critterSide(id, true), headHappy: critterSide(id, false, true), body:c, skin:limb, feet:limb, belly:true, tail: tailSVG(id, c),
    extra: id==="tiger" ? `<path d="M50 100 L58 102 M49 112 L57 112 M90 100 L82 102 M91 112 L83 112" stroke="#3b3a44" stroke-width="3" stroke-linecap="round"/>` : ""};
}

/* o: {id, color 或 look, main, off, armor, anim:{k, el}, face, down, prone, x, y, w, seed}
   down＝生命歸零（橫躺、半透明、X_X）；prone＝被推倒（橫躺、顏色正常） */
function dollSVG(o){
  const L = o.look || critterLook(o.id, o.color), c = L.skin, INK="#2a2630";
  const main = o.main, off = o.off, h = main && HELD[main];
  const two = h && h.two && !off;
  const now = Date.now();
  // 主手：武器跟著手一起轉
  let arm;
  if(main && h){
    const s = h.s ?? .4;
    arm = `<g transform="translate(${h.hx??100} ${h.hy??104}) rotate(${h.ang})">
      <g transform="scale(${s}) translate(${-(h.gx??60)} ${-h.gy})">${ITEM_RAW[main]}</g>
      ${handSVG(0,0,c)}${two?handSVG(0,(h.two-h.gy)*s,c):""}</g>`;
  } else arm = handSVG(100,104,c, main==="unarmed"?10:8.5);
  // 副手
  let offHand = "";
  if(!two){
    if(off==="shield") offHand = handSVG(40,106,c) + heldSVG("shield",38,108);
    else if(off) offHand = heldSVG(off,36,96) + handSVG(40,110,c);
    else offHand = handSVG(40,106,c);
  }
  const glow = GLOW[off] || GLOW[main] || "#f2b441";
  const act = o.anim ? `act-${o.anim.k}` : "";
  const flip = (o.face||1) < 0 ? `transform="translate(140 0) scale(-1 1)"` : "";
  const bob = -((now + (o.seed||0)*237) % 1600);
  const H = o.w*150/140;
  return `<svg class="doll ${o.down?"dl-down":o.prone?"dl-prone":o.cheer?"dl-cheer":""}" x="${o.x}" y="${o.y}" width="${o.w}" height="${H}" viewBox="0 0 140 150" overflow="visible" aria-hidden="true">
    <g ${flip}><g class="dl-lie"><g class="dl-act ${act}" style="--d:${o.anim?-o.anim.el:0}ms;--b:${bob}ms">
      <ellipse cx="60" cy="138" rx="10" ry="5.5" fill="${L.feet}" stroke="${INK}" stroke-width="3"/>
      <ellipse cx="80" cy="138" rx="10" ry="5.5" fill="${L.feet}" stroke="${INK}" stroke-width="3"/>
      <g class="dl-bob">
        ${o.backpack?`<g class="dl-backpack" transform="translate(42 74) scale(.42)">${ITEM_RAW.backpack}</g>`:""}
        ${L.tail}
        <path d="M50 86 Q70 74 90 86 Q98 110 92 128 Q70 140 48 128 Q42 110 50 86 Z" fill="${L.body}" stroke="${INK}" stroke-width="3.5"/>
        ${L.belly?`<ellipse cx="70" cy="113" rx="13" ry="14" fill="#fbf4ee" opacity=".85"/>`:""}
        ${L.extra||""}
        ${armorSVG(o.armor)}
        ${L.head.replace('<svg viewBox="0 0 100 100"', '<svg x="32" y="6" width="76" height="76" viewBox="0 0 100 100"')}
        ${o.cheer && L.headHappy ? `<g>${L.headHappy.replace('<svg viewBox="0 0 100 100"', '<svg x="32" y="6" width="76" height="76" viewBox="0 0 100 100"')}</g>` : ""}
        ${L.headHurt && o.down ? `<g>${L.headHurt.replace('<svg viewBox="0 0 100 100"', '<svg x="32" y="6" width="76" height="76" viewBox="0 0 100 100"')}</g>` :
          L.headHurt && o.anim && o.anim.k==="hurt" ? `<g class="dl-xeyes" data-exp="${now - o.anim.el + DOLL_DUR.hurt}">${L.headHurt.replace('<svg viewBox="0 0 100 100"', '<svg x="32" y="6" width="76" height="76" viewBox="0 0 100 100"')}</g>` : ""}
        <g class="dl-off">${offHand}<circle class="dl-glow" cx="40" cy="96" r="18" fill="${glow}"/></g>
        <g class="dl-arm">${arm}</g>
      </g>
    </g></g></g>
  </svg>`;
}

// 從戰鬥單位算出紙娃娃要拿什麼
function dollGear(u){                       // 敵我一樣：照手上的武器、法器、盾算
  const w = u.weapon ? groupOf(u.weapon).id : null;
  const f = u.focus ? groupOf(u.focus).id : null;
  let main = w, off = null;
  if(!main && (f==="arcane_staff" || f==="shaman_totem")) main = f;   // 杖類法器拿在主手
  if(!main && !f) main = "unarmed";
  if(u.shield) off = "shield";
  else if(f && f!==main) off = f;
  return {main, off, armor: u.armor ? u.armor.n : null, backpack: !!u.backpackEquip};
}

/* ---------- 測試頁：網址加 #doll ---------- */
const DEMO_MAIN = ["sword","heavy","axe","mace","polearm","dagger","bow","crossbow","thrown","unarmed","arcane_staff"];
const DEMO_OFF  = [null,"shield","healing_book","flame_orb"];

const ACT_NAME  = {slash:"揮砍",smash:"重劈",combo:"連擊",spin:"迴旋",thrust:"突刺",guard:"架式",shoot:"射擊",throw:"投擲",punch:"揮拳",cast:"施法",slam:"跳砸",hurt:"受傷",hop:"走路",down:"倒下"};
const GROUP_NAME = k => ({unarmed:"徒手"})[k] || (SKILL_GROUPS.find(g=>g.id===k)||{}).name || "無";
function renderDollDemo(){
  const d = state.demo || (state.demo = {main:"sword", off:"shield", armor:"輕甲", anim:null, down:false});
  const now = Date.now();
  const live = d.anim && now - d.anim.t < DOLL_DUR[d.anim.k] ? {k:d.anim.k, el:now-d.anim.t} : null;
  const who = d.who==="goblin" ? [0,1,2,3].map(i=>({look:MONSTER_LOOK.goblin})) : CRITTERS.map(c=>({id:c.id, color:c.color}));
  const dolls = who.map((w,i)=>`<svg viewBox="-20 -10 180 170" width="200" height="190">${dollSVG({...w, main:d.main, off:d.off, armor:d.armor, anim:live, face:1, down:d.down, x:0, y:0, w:140, seed:i})}</svg>`).join("");
  const chips = (list, cur, key, name) => list.map(v=>`<button class="chip ${v===cur?"on":""}" data-demo="${key}:${v??""}">${name(v)}</button>`).join("");
  return `<section class="page">
    <div class="head"><div><h2>紙娃娃動作測試</h2><p class="rule">簡單身體＋浮空的手，掛上裝備圖示，動作即時演出。</p></div></div>
    <div class="demo-stage">${dolls}</div>

      <div><b>動作</b>${DEMO_ACT.map(k=>`<button class="btn small" data-demo="anim:${k}">${ACT_NAME[k]}</button>`).join("")}
        <button class="btn small ghost" data-demo="down:">${d.down?"站起來":"倒下"}</button></div>
      <div><b>角色</b>${chips(["party","goblin"], d.who||"party", "who", v=>v==="goblin"?"哥布林":"毛絨絨小隊")}</div>
      <div><b>主手</b>${chips(DEMO_MAIN, d.main, "main", GROUP_NAME)}</div>
      <div><b>副手</b>${chips(DEMO_OFF, d.off, "off", v=>v?GROUP_NAME(v):"空手")}</div>
      <div><b>護甲</b>${chips(DEMO_ARM, d.armor, "armor", v=>v||"沒穿")}</div>
    </div>
  </section>`;
}
function bindDollDemo(){
  document.querySelectorAll("[data-demo]").forEach(b=>b.addEventListener("click", ()=>{
    const [k, v] = b.dataset.demo.split(":"), d = state.demo;
    if(k==="anim") d.anim = {k:v, t:Date.now()};
    else if(k==="down") d.down = !d.down;
    else d[k] = v || null;
    render();
  }));
}

/* ======================== 音效：Web Audio 當場合成，不用任何音效檔 ========================
   用法：sfx("hit_blunt", 延遲毫秒)。延遲用來對齊演出（例如箭飛 1 秒後才「打中」）。
   以後要換成真的音效檔：在 SFX_FILES 填 {名稱: "路徑"}，有檔案的就播檔案，沒有的照舊合成。
   手機瀏覽器要先點一下畫面才能出聲，第一次點擊時會自動解鎖。 */

const SFX_FILES = {};           // 例：{hit_blunt:"assets/sfx/hit.ogg"}

const SFX = (()=>{
  let ctx = null, master = null, noiseBuf = null;
  const files = {};             // 名稱 → AudioBuffer（載好的音效檔）
  let muted = false, volume = .7, lastVolume = .7;
  try {
    muted = localStorage.getItem("fuwa-mute")==="1";
    const v = Number(localStorage.getItem("fuwa-volume"));
    if(Number.isFinite(v) && v>=0 && v<=1) volume=v;
    if(volume>0) lastVolume=volume;
  } catch(e){}
  const recent = new Map();     // 同一個聲音同一瞬間只播一次（一招打很多下時不會爆音）

  function init(){
    if(ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : volume; master.connect(ctx.destination);
    // 白噪音（咻聲、打擊聲的材料）
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    Object.entries(SFX_FILES).forEach(([k,url])=>{
      fetch(url).then(r=>r.arrayBuffer()).then(a=>ctx.decodeAudioData(a)).then(buf=>files[k]=buf).catch(()=>{});
    });
    return ctx;
  }
  const unlock = ()=>{ const c = init(); if(c && c.state==="suspended") c.resume(); };
  ["pointerdown","keydown","touchstart"].forEach(ev=>window.addEventListener(ev, unlock, {passive:true}));

  // ---------- 合成零件 ----------
  // 音調：f0 → f1 滑音，攻擊 a 秒後指數衰減到 dur
  function tone(t, {type="sine", f0, f1=f0, dur=.15, gain=.2, a=.005, lp=0}){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t+a);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    let node = o;
    if(lp){ const f = ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value = lp; o.connect(f); node = f; }
    node.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
  }
  // 噪音：經過濾波器，頻率 f0 → f1 掃過去
  function noise(t, {dur=.15, gain=.2, f0=1000, f1=f0, q=1, kind="bandpass", a=.005}){
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = kind; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t); if(f1!==f0) f.frequency.exponentialRampToValueAtTime(f1, t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t+a);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()*.5); s.stop(t+dur+.05);
  }
  const notes = (t, list, o) => list.forEach(([f, dt, dur])=>tone(t+dt, {...o, f0:f, dur:dur||o.dur}));

  // ---------- 音效表 ----------
  const LIB = {
    // 揮動、出手
    swing:     t=>noise(t, {dur:.17, gain:.95, f0:500, f1:2600, q:1.3}),
    swing_big: t=>{ noise(t, {dur:.26, gain:.85, f0:300, f1:1800, q:1.1}); tone(t, {type:"sine", f0:110, f1:70, dur:.2, gain:.12}); },
    twang:     t=>{ tone(t, {type:"sawtooth", f0:220, f1:200, dur:.28, gain:.22, lp:1600}); tone(t, {type:"triangle", f0:440, f1:430, dur:.12, gain:.1});
                    noise(t+.02, {dur:.14, gain:.35, f0:2500, f1:900, q:1.5}); },
    throw:     t=>noise(t, {dur:.24, gain:.85, f0:400, f1:1600, q:1.6}),
    cast:      t=>{ notes(t, [[660,0],[880,.05],[1100,.1],[1320,.15]], {type:"sine", dur:.2, gain:.09}); noise(t, {dur:.3, gain:.05, f0:5000, q:4}); },
    guard:     t=>{ noise(t, {dur:.07, gain:.75, f0:1800, q:3}); tone(t, {type:"square", f0:620, f1:520, dur:.06, gain:.06, lp:2500}); },
    // 打中
    hit_blunt: t=>{ tone(t, {type:"sine", f0:170, f1:50, dur:.16, gain:.6}); noise(t, {dur:.06, gain:.35, f0:900, kind:"lowpass"}); },
    hit_slash: t=>{ noise(t, {dur:.08, gain:.4, f0:3200, f1:1500, q:.8}); tone(t, {type:"triangle", f0:320, f1:110, dur:.1, gain:.3}); },
    hit_pierce:t=>{ tone(t, {type:"square", f0:950, f1:300, dur:.04, gain:.1, lp:3000}); noise(t, {dur:.035, gain:.28, f0:4500, kind:"highpass"}); tone(t+.01, {type:"sine", f0:150, f1:60, dur:.1, gain:.4}); },
    hit_fire:  t=>{ noise(t, {dur:.35, gain:.4, f0:1400, f1:250, kind:"lowpass"}); tone(t, {type:"sawtooth", f0:130, f1:60, dur:.3, gain:.12, lp:600}); },
    hit_magic: t=>{ notes(t, [[1320,0],[1760,.04],[2200,.08]], {type:"sine", dur:.22, gain:.1}); tone(t, {type:"triangle", f0:880, f1:440, dur:.18, gain:.12}); },
    miss:      t=>noise(t, {dur:.2, gain:.55, f0:2600, f1:700, q:1.4}),
    // 被打中的叫聲（配 X_X）
    ouch_pc:   t=>tone(t+.02, {type:"sine", f0:950, f1:420, dur:.2, gain:.16}),
    ouch_foe:  t=>tone(t+.02, {type:"square", f0:320, f1:130, dur:.2, gain:.08, lp:1300}),
    // 倒下
    poof:      t=>{ noise(t, {dur:.4, gain:.35, f0:1600, f1:200, kind:"lowpass"}); tone(t, {type:"sine", f0:420, f1:80, dur:.35, gain:.18}); },
    down:      t=>notes(t, [[523,0],[440,.16],[349,.32,.4]], {type:"triangle", dur:.24, gain:.15}),
    // 其他
    heal:      t=>notes(t, [[523,0],[659,.07],[784,.14],[1047,.21,.4]], {type:"sine", dur:.3, gain:.12}),
    help:      t=>notes(t, [[784,0],[1047,.08,.25]], {type:"triangle", dur:.18, gain:.1}),
    step:      t=>{ tone(t, {type:"sine", f0:180+Math.random()*60, dur:.05, gain:.1}); noise(t, {dur:.03, gain:.04, f0:700, kind:"lowpass"}); },
    alert:     t=>notes(t, [[1250,0],[1250,.07]], {type:"square", dur:.045, gain:.1}),
    turn:      t=>notes(t, [[784,0],[1047,.09,.22]], {type:"triangle", dur:.15, gain:.11}),
    // 介面
    pop:       t=>tone(t, {type:"sine", f0:520, f1:800, dur:.07, gain:.13}),
    back:      t=>tone(t, {type:"sine", f0:620, f1:380, dur:.07, gain:.11}),
    // 爆擊：低沉的轟＋高音的亮點
    crit:      t=>{ tone(t, {type:"sine", f0:90, f1:40, dur:.5, gain:.6}); noise(t, {dur:.3, gain:.5, f0:1200, f1:150, kind:"lowpass"});
                    notes(t+.05, [[1568,0],[2093,.06,.4]], {type:"triangle", dur:.25, gain:.12}); },
    // 勝敗
    win:       t=>notes(t, [[523,0,.14],[659,.12,.14],[784,.24,.14],[1047,.36,.3],[784,.6,.12],[1047,.72,.6]], {type:"triangle", gain:.14}),
    lose:      t=>notes(t, [[392,0,.3],[349,.3,.3],[294,.6,.3],[262,.9,.8]], {type:"triangle", gain:.13})
  };

  function play(name, delay=0){
    if(muted) return;
    const c = init(); if(!c || c.state!=="running") return;
    const t = c.currentTime + Math.max(0, delay)/1000;
    const key = name + "@" + Math.round(t*40);            // 25ms 內同名只播一次
    if(recent.has(key)) return; recent.set(key, 1); if(recent.size>200) recent.clear();
    if(files[name]){ const s = c.createBufferSource(); s.buffer = files[name]; s.connect(master); s.start(t); return; }
    const f = LIB[name]; if(f) f(t);
  }
  function setMuted(m){
    muted = m; try { localStorage.setItem("fuwa-mute", m?"1":"0"); } catch(e){}
    if(master) master.gain.value = m ? 0 : volume;
  }
  function setVolume(v){
    volume = Math.max(0,Math.min(1,Number(v)||0));
    if(volume>0){ lastVolume=volume; muted=false; } else muted=true;
    try { localStorage.setItem("fuwa-volume", String(volume)); localStorage.setItem("fuwa-mute", muted?"1":"0"); } catch(e){}
    if(master) master.gain.value = muted ? 0 : volume;
  }
  function toggleMuted(){
    if(muted && volume===0) volume=lastVolume||.7;
    setMuted(!muted);
  }
  // 測試用：離線算出某個音效的波形（tools/tests/sfx_test.py 用來檢查音量、長度，並匯出試聽檔）
  function renderOffline(name, secs=1.8, rate=44100){
    const off = new OfflineAudioContext(1, Math.round(secs*rate), rate);
    const keep = [ctx, master, noiseBuf];
    ctx = off; master = off.createGain(); master.gain.value = .7; master.connect(off.destination);
    noiseBuf = off.createBuffer(1, rate, rate); const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    LIB[name](0.02);
    [ctx, master, noiseBuf] = keep;
    return off.startRendering().then(buf=>Array.from(buf.getChannelData(0)));
  }
  return {play, setMuted, toggleMuted, setVolume, isMuted:()=>muted, getVolume:()=>volume, names:Object.keys(LIB), renderOffline};
})();
const sfx = (name, delay) => SFX.play(name, delay);

// 動作 → 出手的聲音（跟紙娃娃動畫對齊：揮動在打中前一點點、射箭在放手那一刻）
const HIT_SFX = {"揮砍":"hit_slash", "穿刺":"hit_pierce", "鈍擊":"hit_blunt", "火焰":"hit_fire", "力場":"hit_magic", "光耀":"hit_magic", "流血":"hit_pierce", "強酸":"hit_magic"};
function animSfx(k, lead=0){                 // lead：先擲骰，出招往後延幾毫秒
  const imp = (DOLL_IMPACT[k] || 0) + lead;
  if(k==="shoot") return sfx("twang", imp);
  if(k==="throw") return sfx("throw", imp - 60);
  if(k==="cast")  return sfx("cast", 60 + lead);
  if(k==="guard") return sfx("guard", 120 + lead);
  if(k==="smash" || k==="slam" || k==="spin") return sfx("swing_big", imp - 150);
  if(k==="combo"){ sfx("swing", imp - 100); sfx("swing", imp + 180); sfx("swing", imp + 420); return; }
  sfx("swing", Math.max(lead, imp - 110));
}

/* ======================== 戰鬥引擎：規則與流程（不碰畫面） ========================
   命中 = d20 + 屬性調整值 + 2 ≥ AC；豁免 DC = 8 + 2 + 屬性調整值；1 級生命值 = 8 + 體質調整值
   距離用切比雪夫距離（斜走也算 1 格） */

// ---------- 骰子 ----------
function rollDice(expr){           // "2d6+3" → {total, rolls, mod}
  const m = String(expr).match(/^(\d+)d(\d+)([+-]\d+)?$/);
  if(!m) return {total:+expr||0, rolls:[], mod:+expr||0};
  const rolls = Array.from({length:+m[1]}, ()=>1+Math.floor(Math.random()*+m[2]));
  const mod = +(m[3]||0);
  const b = typeof B==="function" && B();                        // 骰子面板：擲出來的骰先放著，誰受了傷害就算誰那一列的（hurt 裡分）
  if(b && b.panel && !b._noCap) (b._pend = b._pend || []).push(...rolls.map(v=>({sides:+m[2], v})));
  return {total: rolls.reduce((a,b)=>a+b,0)+mod, rolls, mod};
}
const d20 = () => 1+Math.floor(Math.random()*20);
// 距離（D&D 方格，2026-10-01 加入高度）：水平兩軸加上高度差，取最大。一層＝5 呎＝一格
//   所以近戰（觸及 1）只打得到高度差一層以內的人；差兩層手就搆不到
const dist = (a,b) => Math.max(Math.abs(a.x-b.x), Math.abs(a.y-b.y), Math.abs(hAt(a.x,a.y)-hAt(b.x,b.y)));
const sgn = v => v>0?1:v<0?-1:0;

// ---------- 建立戰鬥 ----------
function startBattle(id){
  const def = BATTLES[id];
  const units = [];
  CRITTERS.forEach((c,i)=>{
    const inv = invItems(c.id);
    const mods = {}; ABILITIES.forEach(a=> mods[a.k] = modOf(finalScore(c.id,a.k)));
    const hp = Math.max(1, 8 + mods.CON);
    units.push({
      id:c.id, side:"pc", name:c.name, color:c.color,
      x:def.party[i][0], y:def.party[i][1], hp, maxHp:hp, mods,
      weapon: inv.find(it=>it.type==="weapon" || it.type==="focus") || null,
      spare:  inv.filter(it=>it.type==="weapon" || it.type==="focus").slice(1,2),
      items:  [],
      focus:  null,

const B = () => state.battle;
const unitAt = (x,y) => B().units.find(u=>!u.dead && u.x===x && u.y===y);
// 地形：solid 擋路；cover 攻擊線經過時給的掩護（.5 半掩護 AC+2、.75 四分之三 AC+5）；
//       cost 走進去要花幾格移動；hide 站在裡面時遠程攻擊他有劣勢（被遮蔽）
const TERRAIN = {
  wagon: {name:"馬車", solid:true,  cover:.75},
  crate: {name:"箱子", solid:true,  cover:.5},
  tree:  {name:"樹",   solid:true,  cover:.75},
  bush:  {name:"草叢", solid:false, cost:2, hide:true}
};
const terrainAt = (x,y) => { const o = B().def.blocks.find(b=>b.x===x&&b.y===y); return o ? TERRAIN[o.kind] : null; };
const blocked = (x,y) => { const d=B().def; if(x<0||y<0||x>=d.w||y>=d.h) return true; const t = terrainAt(x,y); return !!(t && t.solid); };
const moveCost = (x,y) => (terrainAt(x,y)||{}).cost || 1;
/* ---------- 高度（大爺 2026-10-01，照 SRD 5.2 簡化） ----------
   戰場資料 elev：[{x0,y0,x1,y1,h}] 矩形區域的高度（層），重疊取高；沒寫的格子高度 0。一層＝5 呎
   爬：往上一層多花 1 格移動（SRD：爬 1 呎花 2 呎），不花動作
   往下：一層直接走下去不多花；兩層以上照爬的算（慢慢爬下去）。被推下兩層以上才是跌落
   跌落：每 10 呎（兩層）1d6 鈍擊，並倒地
   高處不另外加命中或傷害，好處來自地形本身（近戰搆不到、掩護看直線經過的高度） */
const HZ = 40;   // 畫面上一層的高度（像素）
function hAt(x, y){
  const b = B(); if(!b) return 0; const d = b.def;
  if(!d._h){ d._h = new Map(); (d.elev||[]).forEach(r=>{ for(let i=r.x0;i<=r.x1;i++) for(let j=r.y0;j<=r.y1;j++){ const k=`${i},${j}`; d._h.set(k, Math.max(d._h.get(k)||0, r.h)); } }); }
  return d._h.get(`${x},${y}`) || 0;
}
const climbCost = (fx,fy,x,y) => { const dh = hAt(x,y) - hAt(fx,fy); return dh > 0 ? dh : dh <= -2 ? -dh : 0; };
const stepCost = (fx,fy,x,y) => moveCost(x,y) + climbCost(fx,fy,x,y);

// ---------- 掩護與遮蔽 ----------
// 從攻擊者中心畫線到目標中心，看中間經過的格子：地形給的掩護、或擋在中間的「攻擊者的敵方」角色（半掩護）。
// 攻擊者自己的同伴不會擋。取經過的東西裡最好的掩護。回傳 {v:0|.5|.75, by:"箱子"...}
//   高度（2026-10-01）：線從攻擊者出手的高度（站的層 + .8）直直連到目標身體中間（層 + .5）。
//   經過的格子，東西的頂端比線在那裡的高度還低，線就從上面過去、不算掩護；地面本身比線高（斷層）就是四分之三掩護
const COVER_TOP = {wagon:1.5, crate:1, tree:3};   // 地形物件高出地面幾層；角色算 1 層
function coverOf(a, t){
  const n = Math.max(1, dist(a,t)) * 6, seen = new Set();
  const za = hAt(a.x,a.y) + .8, zt = hAt(t.x,t.y) + .5;
  let best = {v:0, by:""};
  for(let i=1;i<n;i++){
    const x = Math.round(a.x + (t.x-a.x)*i/n), y = Math.round(a.y + (t.y-a.y)*i/n), k = `${x},${y}`;
    if(seen.has(k) || (x===a.x&&y===a.y) || (x===t.x&&y===t.y)) continue;
    seen.add(k);
    const z = za + (zt-za)*i/n, g = hAt(x,y);
    if(g > z && best.v < .75) best = {v:.75, by:"斷層"};
    const o = B().def.blocks.find(q=>q.x===x&&q.y===y), ter = o && TERRAIN[o.kind];
    if(ter && ter.cover > best.v && g + (COVER_TOP[o.kind]||1) > z) best = {v:ter.cover, by:ter.name};
    const v = unitAt(x,y);
    if(v && v!==t && v.side!==a.side && !v.down && best.v < .5 && g + 1 > z) best = {v:.5, by:v.name};
  }
  return best;
}
const coverAC = c => c.v>=.75 ? 5 : c.v>=.5 ? 2 : 0;
const coverName = c => c.v>=.75 ? "四分之三掩護" : c.v>=.5 ? "半掩護" : "";
// 夾擊（D&D DMG 的選用規則）：你和一名隊友都貼著同一個敵人、站在牠的正對面兩側 → 近戰攻擊牠有優勢。敵我都適用
function flankMate(a, t){
  if(dist(a,t)!==1) return null;
  const x = 2*t.x - a.x, y = 2*t.y - a.y;
  return B().units.find(v=>v!==a && v.side===a.side && !v.down && !v.dead && v.x===x && v.y===y) || null;

// 站在草叢裡：遠程攻擊他有劣勢
const hidden = t => !!(terrainAt(t.x,t.y)||{}).hide;
const alive = side => B().units.filter(u=>u.side===side && !u.down && !u.dead);

// ---------- 潛行與察覺（SRD 5.2 的躲藏；檢定直接用六圍，沒有技能熟練） ----------
// 能躲：站在草叢裡，或每隻看得到你的敵人跟你之間都有四分之三掩護（樹、篷車），而且旁邊沒有敵人
// 潛行：d20 + 敏捷 ≥ 13（SRD 是 15 含熟練 +2，這裡沒有熟練所以降 2）；穿重甲有劣勢。擲出來的數字＝別人要找到你的難度
// 躲好：敵人不能選你當目標；你攻擊有優勢，出手就現身；走出藏身處被看到、被察覺到也會現身
// 察覺：回合開始時，自己移動格數內躲著的敵人，自動擲 d20 + 感知，大於等於他潛行擲的數字就發現
const HIDE_DC = 13;
const isHid = u => !!has(u,"hidden");
// 敵對：雙方陣營不同、而且都不是 NPC。NPC（商人等）站在戰場上但不屬於任何一方，不能被當成目標、也不會攻擊人
const hostile = (a, b) => a.side!==b.side && a.side!=="npc" && b.side!=="npc";
const sideColor = v => v.side==="pc" ? v.color : v.side==="npc" ? "#c9b7a6" : "#e0766e";
const foeHid = u => u.side==="foe" && isHid(u);                 // 玩家看不到的敵人
const nameFor = u => foeHid(u) ? "？？？" : u.name;
const watchers = u => B().units.filter(v=>hostile(v,u) && !v.down && !v.dead && !isHid(v));
const concealed = u => hidden(u) || watchers(u).every(v=>coverOf(v,u).v >= .75);
function hideBlock(u){                                           // 不能躲的原因；null＝可以躲
  if(isHid(u)) return "已經躲好了";
  if(watchers(u).some(v=>dist(v,u)<=1)) return "敵人就在旁邊";
  if(!concealed(u)) return "要在草叢裡或樹、篷車後面";

}
function tryHide(u){
  const dis = !!(u.armor && u.armor.stealth), r1 = d20(), r2 = dis ? d20() : r1, r = Math.min(r1, r2);
  const total = r + u.mods.DEX, ok = total >= HIDE_DC;
  blog(`　潛行：d20=${r}${dis?`（重甲鏗鏘作響，劣勢 ${r1}/${r2}）`:""}${fmtN(u.mods.DEX)} = ${total} ${ok?"≥":"<"} ${HIDE_DC} → ${ok?"躲好了":"沒躲好"}`, ok?"skill":"miss", ok?"躲好了":"沒躲好");
  if(ok) addStatus(u, "hidden", {val:total});
  return ok;
}
function reveal(u, why){
  if(!isHid(u)) return;
  u.statuses = u.statuses.filter(s=>s.k!=="hidden");
  if(why) blog(`　${u.name}${why}`, "skill");

const senseRange = u => Math.max(0, u.speed - (has(u,"slowed") ? 2 : 0));   // 察覺範圍＝移動速度
function perceive(u){

    const r = d20(), total = r + u.mods.WIS, need = has(v,"hidden").val, ok = total >= need;

    if(ok || v.side==="pc") blog(`${u.name}察覺：d20=${r}${fmtN(u.mods.WIS)} = ${total} ${ok?"≥":"<"} ${need} → ${ok?`發現了${v.name}！`:`沒發現${v.name}`}`, ok?"skill":"miss", ok?"發現了！":"沒發現");

// 有人走動之後：躲著的人如果被看到了（走出草叢或掩護、敵人繞到旁邊）就現身
function checkExposure(){
  B().units.forEach(v=>{ if(isHid(v) && !v.dead && !v.down && !concealed(v)) reveal(v, "被看到了，現身！"); });
}
// 災禍術：攻擊和豁免 −1d4，直到施法的薩滿倒下
const baned = u => { const s = has(u,"bane"); return !!(s && B().units.some(v=>v.id===s.src && !v.dead && !v.down)); };
const cur = () => B().units[B().turn];
// 面向目標（畫面上的左右）
function faceTo(u, t){ const sx = (t.x-t.y)-(u.x-u.y); if(sx) u.face = sx>0 ? 1 : -1; }
// 動作與打中時間：施放技能時設定 B().impact，這段時間後傷害數字、受傷、特效才出現
const impactAt = () => Date.now() + (B().impact||0);

// ---------- 飛行物：弓弩射箭、投擲武器、法術光球 ----------
// 出手（DOLL_IMPACT）時從攻擊者手上飛出，飛到目標才算打中；回傳「打中時間」給 B().impact
const PROJ_OF = {shoot:"arrow", throw:"thrown", cast:"magic"};

function launch(a, t, k, delay=0, thing=null){
  const b = B(), release = DOLL_IMPACT[k] || 0, kind = PROJ_OF[k];

  const foeTarget = t && t.side && hostile(t,a);
  if(!kind || !t || t===a || !(foeTarget || isPoint)) return release + delay;
  const flight = 450;                                         // 飛行時間固定 0.45 秒（大爺：原本 1 秒太慢）
  const glow = GLOW[(a.focus && groupOf(a.focus) || {}).id] || "#b9a0ff";
  const throwArt = kind==="thrown" ? projArtKey(thing || a.weapon) : null;

function fxHit(t, kind){ (B().fx = B().fx || []).push({x:t.x, y:t.y, kind, t:impactAt()}); }
const FX_OF_TYPE = {"揮砍":"slash", "穿刺":"pierce", "鈍擊":"burst", "火焰":"fire", "力場":"spark", "光耀":"spark", "流血":"pierce", "強酸":"spark"};
// 戰鬥紀錄：t 全文（開頭全形空白＝細節），cls 顏色，s 給縮小條用的短結果（例如「命中」「8 點穿刺」）
// at：這行在畫面上成立的時間（打中那一刻）。縮小條、紀錄面板到了這個時間才顯示，骰子還在滾時不會先劇透結果

// ---------- 狀態效果 ----------
// {k, src, until:"start"|"end"|"battle", of:unitId, val}
function addStatus(u, k, o={}){ u.statuses = u.statuses.filter(s=>!(s.k===k && s.src===o.src)); u.statuses.push({k, ...o}); }
const has = (u,k) => u.statuses.find(s=>s.k===k);
function expire(when, unitId){
